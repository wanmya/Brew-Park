<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ビール仕込みノート</title>
<meta name="description" content="ビール醸造の工程を並べ、液量と比重の変化を管理するアプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="仕込みノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px)!important}
[hidden]{display:none!important}
img{max-width:100%}
input[type=number],input[type=text],textarea{-webkit-appearance:none;appearance:none}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column (phone first). Home = 3 brewing methods + saved recipes; editor = summary card, ordered step cards, bottom-sheet step picker. */
:root{
  --bg:#eef0eb; --surface:#ffffff; --sunk:#f6f7f3; --ink:#1c221f; --muted:#5d6862; --line:#d9ded6;
  --accent:#a95b0c; --accent-soft:#f5e6d3; --accent-ink:#ffffff;
  --hop:#3b7234; --hop-soft:#e2eedd; --danger:#b23a2a;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a1f1c; --sunk:#151917; --ink:#e7ebe6; --muted:#9aa49e; --line:#2c3430;
  --accent:#e39a48; --accent-soft:#33261a; --accent-ink:#1a1209;
  --hop:#86c276; --hop-soft:#1f2d1d; --danger:#f0806e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a1f1c; --sunk:#151917; --ink:#e7ebe6; --muted:#9aa49e; --line:#2c3430;
  --accent:#e39a48; --accent-soft:#33261a; --accent-ink:#1a1209;
  --hop:#86c276; --hop-soft:#1f2d1d; --danger:#f0806e; color-scheme:dark}

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* home */
.brand{display:flex;flex-direction:column;gap:4px;padding-top:8px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.75rem;letter-spacing:.02em;line-height:1.2}
.brand p{margin:0;color:var(--muted);font-size:.9rem}
.label{font-size:.75rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
.methods{display:flex;flex-direction:column;gap:10px}
.method{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.method:active{transform:scale(.99)}
.method svg{width:56px;height:56px;color:var(--accent)}
.method b{display:block;font-size:1.1rem}
.method span{display:block;color:var(--muted);font-size:.85rem;line-height:1.5}
.method i{font-style:normal;color:var(--accent);font-size:1.3rem}
.saved{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.saved-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.saved-row .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.saved-row .open b{display:block;overflow-wrap:anywhere}
.saved-row .open span{color:var(--muted);font-size:.8rem}
.chip{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.chip.hop{background:var(--hop-soft);color:var(--hop)}
.chip.plain{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.ghost.warn{border-color:var(--danger);color:var(--danger)}
.empty-note{color:var(--muted);font-size:.9rem;padding:12px 0}

/* editor */
.topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{background:var(--surface);border:1px solid var(--line);border-radius:99px;width:38px;height:38px;flex:none;font-size:1.1rem}
.topbar .namebox{flex:1;min-width:0}
.namebox input{width:100%;border:0;background:none;font-family:var(--f-body);font-weight:700;font-size:1.15rem;color:var(--ink);padding:2px 0;border-bottom:1px dashed var(--line);border-radius:0}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.stat b{font-family:var(--f-num);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:.75rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart-wrap{overflow-x:auto}

.steps{display:flex;flex-direction:column;gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px}
.step-no{font-family:var(--f-num);font-weight:600;font-size:.8rem;color:var(--accent-ink);background:var(--accent);border-radius:6px;min-width:26px;height:26px;display:grid;place-items:center;flex:none}
.step-title{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.step-title b{display:block;font-size:1rem}
.step-title span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-title input{width:100%;font:inherit;font-weight:700;border:0;border-bottom:1px dashed var(--line);background:none;color:var(--ink);padding:0}
.icons{display:flex;gap:4px;flex:none}
.icon{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:.9rem;display:grid;place-items:center;padding:0}
.icon:disabled{opacity:.35;cursor:default}
.icon.warn{border-color:var(--danger);color:var(--danger);width:auto;padding:0 8px;font-size:.75rem}
.step-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field label{font-size:.75rem;color:var(--muted)}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:0 8px;min-width:0}
.inp input,.inp select{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-family:var(--f-num);font-size:1rem;padding:7px 0;font-variant-numeric:tabular-nums}
.inp input[type=text]{font-family:var(--f-body)}
.inp u{text-decoration:none;color:var(--muted);font-size:.8rem;padding-left:4px;white-space:nowrap}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.listed{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:1fr 84px auto 32px;gap:6px;align-items:center}
.lrow.two{grid-template-columns:1fr 92px 32px}
.lrow .inp input{font-size:.95rem}
.lrow select{font-family:var(--f-body);font-size:.85rem}
.lrow.three{grid-template-columns:minmax(0,1fr) 74px 74px 32px}
.lrow.three .inp{padding:0 6px}
.lhead{font-size:.72rem;color:var(--muted);margin-bottom:-4px}
.calc{background:var(--hop-soft);border-radius:8px;padding:8px 10px;font-size:.84rem;display:flex;flex-direction:column;gap:4px;line-height:1.55}
.calc-res{font-size:.95rem}
.calc .muted{color:var(--muted)}
.gtable-wrap{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px;overflow-x:auto}
.gtable{width:100%;border-collapse:collapse;font-size:.82rem}
.gtable th{font-weight:500;color:var(--muted);font-size:.72rem;text-align:right;padding:2px 4px}
.gtable th:nth-child(2){text-align:left}
.gtable td{padding:5px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.gtable td:nth-child(1){color:var(--muted);width:1.5em}
.gtable td:nth-child(2){text-align:left;white-space:normal}
.gtable tr.r-same td:nth-child(n+3){color:var(--muted)}
.gtable tr.r-calc td:nth-child(4){color:var(--accent);font-weight:600}
.gtable tr.r-meas td:nth-child(4){color:var(--hop);font-weight:600}
.gtable .dot{font-size:.6rem}
.addrow{align-self:flex-start;background:none;border:1px dashed var(--line);border-radius:8px;padding:5px 12px;font-size:.85rem;color:var(--accent)}
.meas{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.meas-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
textarea{width:100%;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink);padding:7px 8px;resize:vertical;min-height:38px;box-sizing:border-box}
.after{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--sunk);border-top:1px solid var(--line);padding:8px 12px;font-size:.85rem}
.after .num{font-weight:600}
.after .muted{color:var(--muted)}
.helper{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:.88rem;display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.helper button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:5px 12px;font-size:.82rem;font-weight:700}

.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:14px;font-weight:700;font-size:1rem;width:100%}
.secondary{background:var(--surface);color:var(--accent);border:1px solid var(--accent);border-radius:var(--r);padding:12px;font-weight:700;width:100%}
.empty-steps{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px 16px;display:flex;flex-direction:column;gap:12px;text-align:center}
.empty-steps p{margin:0;color:var(--muted);font-size:.9rem}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,11,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:82%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:1.05rem}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.pick b{font-size:.95rem}
.pick span{font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head>
<body>
<div id="app"></div>

<script>
const KEY='brew-notes-v1';
const STYLES={
  lauter:{name:'ロイタータン',desc:'マッシュタンで糖化し、ロイタータンで濾過する全粒仕込み',
    tpl:['water','malt','protein','mash','mashout','boil','cool','trub','aerate','dilute','yeast'],
    picks:['water','malt','acid','protein','mash','decoction','mashout','boil','cool','trub','aerate','dilute','yeast']},
  biab:{name:'BIAB',desc:'モルトを袋に入れ、ひとつの鍋で糖化から煮沸まで行う',
    tpl:['water','malt','mash','mashout','bag','boil','cool','trub','aerate','dilute','yeast'],
    picks:['water','malt','acid','protein','mash','mashout','bag','boil','cool','trub','aerate','dilute','yeast']},
  extract:{name:'DME・モルト缶',desc:'モルトエキスを湯に溶かして作る。糖化なし',
    tpl:['water','dissolve','boil','cool','dilute','aerate','yeast'],
    picks:['water','heat','dissolve','boil','cool','trub','dilute','aerate','yeast']}
};
const T='temp',M='time';
const fTemp=(l='温度',d)=>({k:'temp',l,u:'℃',d});
const fTime=(l='時間',d)=>({k:'time',l,u:'分',d});
const TYPES={
  water:{n:'水質調整',sub:'仕込みに使う水と添加物',fields:[{k:'vol',l:'水量（マッシング＋スパージングの合計）',u:'L'}],
    list:{k:'adds',kind:'add',ph:'添加物の名前',def:[{name:'乳酸 (88%)',amt:'',unit:'ml'},{name:'塩化カルシウム',amt:'',unit:'g'}]},
    hint:'添加物の種類と量は、あとで詳しく設定できるようにする予定です'},
  malt:{n:'モルト投入',sub:'使うモルトと量',list:{k:'malts',kind:'kg',ph:'モルト名',def:[{name:'ピルスナーモルト',amt:'',yld:'80'}]}},
  acid:{n:'アシッドレスト',sub:'pHを下げる休止',fields:[fTemp('温度',35),fTime('時間',20)]},
  protein:{n:'プロテインレスト',sub:'タンパク分解の休止',fields:[fTemp('温度',52),fTime('時間',15)]},
  mash:{n:'マッシング',sub:'糖化。スパージング後の比重を計算',fields:[fTemp('温度',66),fTime('時間',60),{k:'eff',l:'糖化効率',u:'%',d:72},{k:'abs',l:'モルト吸水量',u:'L/kg',d:1}]},
  decoction:{n:'デコクション',sub:'一部を煮出して戻す',fields:[{k:'pull',l:'取り出し量',u:'L'},fTemp('目標温度',72),fTime('煮沸時間',15)]},
  mashout:{n:'マッシュアウト',sub:'酵素を止める',fields:[fTemp('温度',76),fTime('時間',10)]},
  bag:{n:'バッグ引き上げ',sub:'袋を上げて水を切る',fields:[fTime('水切り時間',10)]},
  heat:{n:'湯沸かし',sub:'エキスを溶かす湯',fields:[{k:'vol',l:'水量',u:'L'},fTemp('温度',70)]},
  dissolve:{n:'エキス溶解',sub:'DME・モルト缶を溶かす',list:{k:'malts',kind:'kg',ph:'DME / モルト缶',def:[{name:'モルト缶',amt:'1.7',yld:'78'}]}},
  boil:{n:'ボイル',sub:'煮沸。灰汁で液量が減り、蒸発で比重が上がる',fields:[fTime('時間',60),{k:'aku',l:'灰汁として捨てる量',u:'L'},{k:'evap',l:'蒸発量',u:'L'}]},
  cool:{n:'冷却',sub:'酵母投入温度まで下げる',fields:[fTemp('目標温度',20),fTime('時間',null)]},
  trub:{n:'澱引き',sub:'澱を除いて液量が減る',fields:[{k:'loss',l:'除去量',u:'L'}]},
  aerate:{n:'エアレーション',sub:'酸素を溶かし込む',fields:[fTime('時間',5)]},
  dilute:{n:'希釈',sub:'麦汁に水を加える',fields:[{k:'add',l:'加水量',u:'L'},{k:'target',l:'目標比重',u:'SG',step:'0.001'}]},
  yeast:{n:'酵母投入',sub:'ピッチング',fields:[{k:'name',l:'酵母',t:'text'},fTemp('投入温度',null)]},
  measure:{n:'比重測定',sub:'液量と比重だけ記録',fields:[]},
  custom:{n:'自由工程',sub:'名前を自分で付ける',fields:[fTemp('温度',null),fTime('時間',null)]}
};
const OTHER=['measure','custom'];

let db=load(), view={screen:'home',rid:null}, sheet=false, armed=null;

function uid(){return Math.random().toString(36).slice(2,9)}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.recipes)){s.recipes.forEach(r=>{r.steps=r.steps.filter(x=>TYPES[x.type])});return s}}catch(e){}
  return {recipes:[sample()]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function mkStep(type,style){
  const t=TYPES[type],p={};
  (t.fields||[]).forEach(f=>{p[f.k]=f.d==null?'':String(f.d)});
  const s={id:uid(),type,p,meas:{vol:'',sg:''},memo:'',open:true};
  if(t.list)s.list=t.list.def.map(x=>({...x}));
  if(type==='custom')s.title='';
  if(type==='mash'&&style==='biab')s.p.abs='0.6';
  return s;
}
function sample(){
  const r={id:uid(),name:'例：ジャーマンピルス 20L',style:'lauter',updated:Date.now(),steps:[]};
  const add=(type,p={},meas={},extra={})=>{const s=mkStep(type);Object.assign(s.p,p);Object.assign(s.meas,meas);Object.assign(s,extra);s.open=false;r.steps.push(s)};
  add('water',{vol:'29'},{}, {list:[{name:'乳酸 (88%)',amt:'2',unit:'ml'},{name:'塩化カルシウム',amt:'3',unit:'g'}]});
  add('malt',{},{}, {list:[{name:'ピルスナーモルト',amt:'4.6',yld:'80'},{name:'ミュンヘンモルト',amt:'0.4',yld:'78'}]});
  add('protein',{temp:'52',time:'15'});
  add('mash',{temp:'65',time:'60',eff:'75',abs:'1'});
  add('mashout',{temp:'76',time:'10'});
  add('boil',{time:'70',aku:'0.5',evap:'4'},{sg:'1.052'});
  add('cool',{temp:'12',time:'30'});
  add('trub',{loss:'2'});
  add('dilute',{add:'',target:'1.048'});
  add('aerate',{time:'5'});
  add('yeast',{name:'W-34/70',temp:'12'});
  return r;
}
const cur=()=>db.recipes.find(r=>r.id===view.rid);
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:null};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fv=v=>v==null?'—':v.toFixed(1);
const fsg=v=>v==null?'—':v.toFixed(3);
const plato=sg=>-616.868+1111.14*sg-630.272*sg*sg+135.997*sg*sg*sg;

/* 比重・液量の追跡
   マッシング：糖化効率は、マッシングからスパージング完了までで麦汁に取り出せるエキスの割合。
   取り出せるエキス(kg) = Σ モルト量 × 収率 × 糖化効率。仕込み水の合計からモルトの吸水を引いた水に溶けているとして、
   濃度(°P)から比重を出す。これがスパージング完了後（ボイル前）の麦汁。
   ボイル：灰汁で液量が減り（比重は同じ）、蒸発で糖の総量はそのまま濃くなる。澱引きは比重そのまま、加水は薄まる */
const DEF={yld:80,eff:72,abs:1};
const sgFromP=P=>1+P/(258.6-(P/258.2)*227.1);
function wortOf(E,W){const P=100*E/(W+E),sg=sgFromP(P);return {sg,P,vol:(W+E)/sg}}
function track(r){
  let vol=null,sg=null,water=0,kg=0,pot=0,done=false;const out=[];
  for(const s of r.steps){
    const before={vol,sg};let changed=false,info=null;
    if(s.type==='water'||s.type==='heat')water+=n(s.p.vol)||0;
    if((s.type==='malt'||s.type==='dissolve')&&s.list)s.list.forEach(it=>{const k=n(it.amt);if(k){kg+=k;pot+=k*(n(it.yld)??DEF.yld)/100}});
    if(s.type==='mash'&&!done){
      const eff=n(s.p.eff)??DEF.eff,ab=n(s.p.abs)??DEF.abs,absL=ab*kg;
      info={kind:'mash',kg,pot,water,eff,absL};
      if(pot>0&&water>absL){const E=pot*eff/100,w=wortOf(E,water-absL);vol=w.vol;sg=w.sg;changed=true;done=true;Object.assign(info,{E,P:w.P,vol,sg})}
    }
    if(s.type==='dissolve'){
      info={kind:'dissolve',kg,pot,water};
      if(pot>0&&water>0){const w=wortOf(pot,water);vol=w.vol;sg=w.sg;changed=true;done=true;Object.assign(info,{E:pot,P:w.P,vol,sg})}
    }
    if(s.type==='boil'&&vol!=null){
      const ak=n(s.p.aku),e=n(s.p.evap);
      if(ak){vol=Math.max(0,vol-ak);changed=true}
      if(e&&vol>e){if(sg!=null)sg=1+(sg-1)*vol/(vol-e);vol-=e;changed=true}
    }
    if(s.type==='trub'){const l=n(s.p.loss);if(l&&vol!=null){vol=Math.max(0,vol-l);changed=true}}
    if(s.type==='dilute'){const a=n(s.p.add);if(a&&vol!=null){if(sg!=null)sg=1+(sg-1)*vol/(vol+a);vol+=a;changed=true}}
    const mv=n(s.meas.vol),ms=n(s.meas.sg);
    let src=changed?'calc':null;
    if(mv!=null){vol=mv;src='meas'}
    if(ms!=null){sg=ms;src='meas'}
    out.push({before,vol,sg,src,info});
  }
  return out;
}
function calcInfo(s,t){
  const i=t.info;if(!i)return '';
  const isMash=i.kind==='mash';
  if(!i.kg)return `<p class="hint">この工程より前の「${isMash?'モルト投入':'エキス溶解'}」に量を入れると、${isMash?'スパージング完了後':'溶解後'}の比重を計算します。</p>`;
  if(!i.water||(isMash&&i.water<=i.absL))return `<p class="hint">この工程より前の「水質調整」に、マッシングとスパージングで使う水量の合計を入れると、比重を計算します。</p>`;
  const lines=isMash
    ?`モルト <span class="num">${i.kg.toFixed(2)} kg</span>（エキス最大 <span class="num">${i.pot.toFixed(2)} kg</span>）× 糖化効率 <span class="num">${i.eff}%</span> = <b class="num">${i.E.toFixed(2)} kg</b> を取り出す<br>仕込み水の合計 <span class="num">${fv(i.water)} L</span> − モルトの吸水 <span class="num">${fv(i.absL)} L</span>`
    :`エキス <span class="num">${i.kg.toFixed(2)} kg</span> × 収率 = <b class="num">${i.E.toFixed(2)} kg</b>、水 <span class="num">${fv(i.water)} L</span>`;
  return `<div class="calc"><div>${lines}</div><div class="calc-res">${isMash?'スパージング完了後の麦汁 ':''}→ <b class="num">${fv(i.vol)} L</b> / <b class="num">SG ${fsg(i.sg)}</b> <span class="num muted">${i.P.toFixed(1)}°P</span></div></div>`;
}
function totalTime(r){return r.steps.reduce((a,s)=>a+(n(s.p.time)||0),0)}

function render(){
  const app=document.getElementById('app');
  app.innerHTML=view.screen==='home'?homeHTML():editorHTML();
  let sh=document.getElementById('sheet');
  if(sheet&&view.screen==='editor'){
    if(!sh){sh=document.createElement('div');sh.id='sheet';document.body.appendChild(sh)}
    sh.innerHTML=sheetHTML();
  }else if(sh)sh.remove();
}

function stepSummary(s){
  const t=TYPES[s.type],bits=[];
  (t.fields||[]).forEach(f=>{const v=s.p[f.k];if(v!==''&&v!=null)bits.push(f.t==='text'?v:`${f.l} ${v}${f.u==='SG'?'':f.u}`)});
  if(s.list){const it=s.list.filter(x=>x.name);if(it.length)bits.push(it.map(x=>x.name+(x.amt?` ${x.amt}${x.unit||'kg'}`:'')).join('、'))}
  return bits.join(' · ')||t.sub;
}

function editorHTML(){
  const r=cur();if(!r){view.screen='home';return homeHTML()}

function summaryInner(r,tr,lastK,tt){
  const pts=tr.map((x,i)=>({i,sg:x.sg,src:x.src})).filter(x=>x.sg!=null);
  return `<div class="stats">
    <div class="stat"><small>最終液量</small><b>${lastK&&lastK.vol!=null?fv(lastK.vol):'—'}<span style="font-size:.75rem"> L</span></b></div>
    <div class="stat"><small>最終比重</small><b>${lastK&&lastK.sg!=null?fsg(lastK.sg):'—'}</b><em>${lastK&&lastK.sg!=null?plato(lastK.sg).toFixed(1)+' °P':'比重未測定'}</em></div>
    <div class="stat"><small>工程時間の合計</small><b>${tt?Math.floor(tt/60)+':'+String(tt%60).padStart(2,'0'):'—'}</b><em>${r.steps.length} 工程</em></div></div>
  ${chartSVG(r,tr,pts)}${gravTable(r,tr)}`;
}

function gravTable(r,tr){
  if(!tr.some(x=>x.sg!=null))return '';
  return `<div class="gtable-wrap"><div class="label">工程ごとの比重</div><table class="gtable"><thead><tr><th></th><th>工程</th><th>液量</th><th>比重</th><th>°P</th></tr></thead><tbody>${r.steps.map((s,i)=>{const t=tr[i],nm=s.type==='custom'?(s.title||'自由工程'):TYPES[s.type].n;
    return `<tr class="${t.src==='meas'?'r-meas':t.src==='calc'?'r-calc':'r-same'}"><td class="num">${i+1}</td><td>${esc(nm)}</td><td class="num">${t.vol!=null?fv(t.vol)+' L':'—'}</td><td class="num">${fsg(t.sg)}${t.src==='meas'?' <span class="dot">●</span>':''}</td><td class="num">${t.sg!=null?plato(t.sg).toFixed(1):'—'}</td></tr>`}).join('')}</tbody></table></div>`;
}
function chartSVG(r,tr,pts){
  if(pts.length<1)return `<p class="hint">工程のどこかに液量と比重の実測値を入れると、澱引き・ボイル・希釈のあとの比重を計算して、ここに推移を表示します。</p>`;
  const N=r.steps.length,W=520,H=130,L=40,R=12,Tp=12,B=26;
  const sgs=pts.map(p=>p.sg);let lo=Math.min(...sgs),hi=Math.max(...sgs);
  if(hi-lo<0.006){const m=(hi+lo)/2;lo=m-0.004;hi=m+0.004}
  const pad=(hi-lo)*.15;lo-=pad;hi+=pad;
  const x=i=>L+(N<=1?0.5:i/(N-1))*(W-L-R),y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);
  const ticks=[hi-pad,(hi+lo)/2,lo+pad];
  let s=`<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="工程ごとの比重の推移">`;
  ticks.forEach(t=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t.toFixed(3)}</text>`});
  for(let i=0;i<N;i++)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${i+1}</text>`;
  if(pts.length>1)s+=`<polyline points="${pts.map(p=>x(p.i)+','+y(p.sg)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach(p=>{const m=p.src==='meas';s+=`<circle cx="${x(p.i)}" cy="${y(p.sg)}" r="${m?4.5:3.5}" fill="${m?'var(--hop)':'var(--surface)'}" stroke="${m?'var(--hop)':'var(--accent)'}" stroke-width="2"/>`});
  s+=`</svg></div><div style="display:flex;gap:12px;font-size:.75rem;color:var(--muted)"><span><span style="color:var(--hop)">●</span> 実測</span><span><span style="color:var(--accent)">○</span> 計算</span><span>横軸は工程番号</span></div>`;
  return s;
}

function inputHTML(sid,group,f,val){

function stepHTML(r,s,i,t){
  const ty=TYPES[s.type],last=i===r.steps.length-1;
  const title=s.type==='custom'?(s.title||'自由工程'):ty.n;

    <button class="step-title" data-act="toggle" data-id="${s.id}" aria-expanded="${s.open}"><b>${esc(title)}</b>${s.open?'':`<span>${esc(stepSummary(s))}</span>`}</button>
    <div class="icons"><button class="icon" data-act="up" data-id="${s.id}" ${i===0?'disabled':''} aria-label="上へ">↑</button><button class="icon" data-act="down" data-id="${s.id}" ${last?'disabled':''} aria-label="下へ">↓</button>
    <button class="icon ${armed===s.id?'warn':''}" data-act="dels" data-id="${s.id}" aria-label="削除">${armed===s.id?'削除する':'✕'}</button></div></div>`;
  if(s.open){
    h+=`<div class="step-body">`;
    if(s.type==='custom')h+=`<div class="field"><label for="${s.id}-title">工程名</label><div class="inp"><input id="${s.id}-title" type="text" data-f="${s.id}|title" value="${esc(s.title)}" placeholder="例：ホップスタンド"></div></div>`;
    if(ty.fields&&ty.fields.length)h+=`<div class="fields">${ty.fields.map(f=>inputHTML(s.id,'p',f,s.p[f.k])).join('')}</div>`;
    if(ty.list)h+=listHTML(s,ty.list);
    if(ty.hint)h+=`<p class="hint">${ty.hint}</p>`;
    if(s.type==='dilute')h+=`<div id="help-${s.id}">${diluteHelp(s,t)}</div>`;
    if(s.type==='mash'||s.type==='dissolve')h+=`<div id="info-${s.id}">${calcInfo(s,t)}</div>`;
    h+=`<div class="meas"><div class="meas-head"><span class="label">この工程後の実測</span>${s.type==='measure'?'':'<span class="hint">わかる時だけ</span>'}</div>
      <div class="fields">${inputHTML(s.id,'meas',{k:'vol',l:'液量',u:'L'},s.meas.vol)}${inputHTML(s.id,'meas',{k:'sg',l:'比重',u:'SG',step:'0.001'},s.meas.sg)}</div>
      <textarea id="${s.id}-memo" data-f="${s.id}|memo" rows="1" placeholder="メモ">${esc(s.memo)}</textarea></div></div>`;
  }
  h+=`<div class="after" id="after-${s.id}">${afterHTML(t)}</div></article>`;
  return h;
}
function afterHTML(t){
  if(t.vol==null&&t.sg==null)return `<span class="muted">工程後の液量・比重：未確定</span>`;
  return `<span class="muted">工程後</span><span class="num">${fv(t.vol)} L</span><span class="num">SG ${fsg(t.sg)}</span>${t.sg!=null?`<span class="num muted">${plato(t.sg).toFixed(1)}°P</span>`:''}${t.src==='meas'?'<span class="chip hop">実測</span>':t.src==='calc'?'<span class="chip">計算</span>':'<span class="chip plain">前工程のまま</span>'}`;
}
function diluteHelp(s,t){
  const tg=n(s.p.target),b=t.before;
  if(tg==null)return `<p class="hint">目標比重を入れると、必要な加水量を計算します。</p>`;
  if(b.vol==null||b.sg==null)return `<p class="hint">この前の工程で液量と比重がわかると、必要な加水量を計算できます。</p>`;
  if(tg>=b.sg)return `<p class="hint">加水前の比重 ${fsg(b.sg)} がすでに目標以下です。加水は不要です。</p>`;
  const need=b.vol*((b.sg-1)/(tg-1)-1);
  return `<div class="helper"><span>加水前 <span class="num">${fv(b.vol)} L / ${fsg(b.sg)}</span> → 目標 <span class="num">${fsg(tg)}</span> には <b class="num">${need.toFixed(2)} L</b></span><button data-act="applyDil" data-id="${s.id}" data-v="${need.toFixed(2)}">加水量に入れる</button></div>`;
}
function listHTML(s,L){
  const isAdd=L.kind==='add';
  const head=isAdd?'':`<div class="lrow three lhead"><span>名前</span><span>量</span><span>収率</span><span></span></div>`;
  return `<div class="listed"><span class="label">${isAdd?'添加物':'投入するもの'}</span>${head}${s.list.map((it,j)=>`<div class="lrow ${isAdd?'':'three'}">
    <div class="inp"><input type="text" id="${s.id}-l${j}-name" aria-label="名前" data-f="${s.id}|list|${j}|name" value="${esc(it.name)}" placeholder="${L.ph}"></div>
    <div class="inp"><input type="number" inputmode="decimal" step="any" id="${s.id}-l${j}-amt" aria-label="量" data-f="${s.id}|list|${j}|amt" value="${esc(it.amt)}">${isAdd?'':'<u>kg</u>'}</div>
    ${isAdd?`<div class="inp"><select id="${s.id}-l${j}-unit" aria-label="単位" data-f="${s.id}|list|${j}|unit">${['g','ml','mg/L'].map(u=>`<option ${it.unit===u?'selected':''}>${u}</option>`).join('')}</select></div>`
      :`<div class="inp"><input type="number" inputmode="decimal" step="any" id="${s.id}-l${j}-yld" aria-label="収率" data-f="${s.id}|list|${j}|yld" value="${esc(it.yld)}" placeholder="${DEF.yld}"><u>%</u></div>`}
    <button class="icon" data-act="delItem" data-id="${s.id}" data-j="${j}" aria-label="行を削除">✕</button></div>`).join('')}
    ${isAdd?'':`<p class="hint">収率はモルト1kgから取れるエキスの割合。ベースモルトは約80%、DMEは約95%、モルト缶は約78%。</p>`}
    <button class="addrow" data-act="addItem" data-id="${s.id}">＋ 行を追加</button></div>`;

function sheetHTML(){
  const r=cur(),st=STYLES[r.style];

  const grid=ks=>`<div class="picks">${ks.map(k=>`<button class="pick" data-act="add" data-type="${k}"><b>${TYPES[k].n}</b><span>${TYPES[k].sub}</span></button>`).join('')}</div>`;
  return `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="工程を追加">
    <div class="sheet-head"><h2>工程を追加</h2><button class="ghost" data-act="close">閉じる</button></div>

    <div class="label">記録・その他</div>${grid([...OTHER,...rest])}</div></div>`;

function refreshComputed(){
  const r=cur();if(!r)return;const tr=track(r),lastK=[...tr].reverse().find(x=>x.vol!=null||x.sg!=null);
  document.getElementById('summary').innerHTML=summaryInner(r,tr,lastK,totalTime(r));
  r.steps.forEach((s,i)=>{const a=document.getElementById('after-'+s.id);if(a)a.innerHTML=afterHTML(tr[i]);
    const h=document.getElementById('help-'+s.id);if(h)h.innerHTML=diluteHelp(s,tr[i]);
    const c=document.getElementById('info-'+s.id);if(c)c.innerHTML=calcInfo(s,tr[i])});
}
function touch(){const r=cur();if(r)r.updated=Date.now();save()}

function onInput(e){
  const el=e.target.closest('[data-f]');if(!el)return;
  const parts=el.dataset.f.split('|'),r=cur();if(!r)return;
  if(parts[0]==='recipe'){r.name=el.value;touch();return}
  const s=r.steps.find(x=>x.id===parts[0]);if(!s)return;
  if(parts[1]==='p')s.p[parts[2]]=el.value;
  else if(parts[1]==='meas')s.meas[parts[2]]=el.value;
  else if(parts[1]==='list')s.list[+parts[2]][parts[3]]=el.value;
  else if(parts[1]==='memo')s.memo=el.value;
  else if(parts[1]==='title')s.title=el.value;
  touch();refreshComputed();
}
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.classList.contains('scrim')&&e.target!==b)return;
  const a=b.dataset.act,id=b.dataset.id,r=cur();
  const prevArmed=armed;armed=null;
  const idx=r?r.steps.findIndex(s=>s.id===id):-1;
  switch(a){
    case 'new':{const st=b.dataset.style,nr={id:uid(),name:'',style:st,updated:Date.now(),steps:['water',st==='extract'?'dissolve':'malt'].map(k=>mkStep(k,st))};db.recipes.push(nr);view={screen:'editor',rid:nr.id};save();break}
    case 'open':view={screen:'editor',rid:id};break;
    case 'home':view={screen:'home',rid:null};sheet=false;break;
    case 'delr':if(prevArmed==='r'+id){db.recipes=db.recipes.filter(x=>x.id!==id);save()}else armed='r'+id;break;
    case 'tpl':{const have=new Set(r.steps.map(x=>x.type));STYLES[r.style].tpl.filter(k=>!have.has(k)).forEach(k=>{const s=mkStep(k,r.style);s.open=false;r.steps.push(s)});touch();break}
    case 'sheet':sheet=true;break;
    case 'close':sheet=false;break;
    case 'add':{const s=mkStep(b.dataset.type,r.style);r.steps.push(s);sheet=false;touch();render();
      requestAnimationFrame(()=>document.getElementById('st-'+s.id)?.scrollIntoView({behavior:'smooth',block:'center'}));return}
    case 'toggle':r.steps[idx].open=!r.steps[idx].open;save();break;
    case 'up':if(idx>0){[r.steps[idx-1],r.steps[idx]]=[r.steps[idx],r.steps[idx-1]];touch()}break;
    case 'down':if(idx<r.steps.length-1){[r.steps[idx+1],r.steps[idx]]=[r.steps[idx],r.steps[idx+1]];touch()}break;
    case 'dels':if(prevArmed===id){r.steps.splice(idx,1);touch()}else armed=id;break;
    case 'addItem':{const s=r.steps[idx];s.list.push(TYPES[s.type].list.kind==='add'?{name:'',amt:'',unit:'g'}:{name:'',amt:'',yld:''});touch();break}
    case 'delItem':r.steps[idx].list.splice(+b.dataset.j,1);touch();break;
    case 'applyDil':r.steps[idx].p.add=b.dataset.v;touch();break;
  }
  render();
});
render();
</script>
