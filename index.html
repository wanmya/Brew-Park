<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ビール仕込みノート</title>
<meta name="description" content="ビール醸造の工程を並べ、液量と比重の変化を管理するアプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="bp-icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="bp-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brew Park">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;padding-top:env(safe-area-inset-top,0px)!important}
[hidden]{display:none!important}
img{max-width:100%}
input[type=number],input[type=text],textarea{-webkit-appearance:none;appearance:none}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column (phone first). Home = 3 brewing methods + saved recipes; editor = summary card, ordered step cards, bottom-sheet step picker. */
:root{
  --bg:#eef0eb; --surface:#ffffff; --sunk:#f6f7f3; --ink:#1c221f; --muted:#5d6862; --line:#d9ded6;
  --accent:#a95b0c; --accent-soft:#f5e6d3; --accent-ink:#ffffff;
  --hop:#3b7234; --hop-soft:#e2eedd; --danger:#b23a2a;
  --g1:#3f8a3a; --g1-soft:#e6f2e2; --g2:#b98a00; --g2-soft:#fbf1d2; --g3:#c0442f; --g3-soft:#f9e4df;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --g1:#6fc066; --g1-soft:#1b2a19; --g2:#e7c04a; --g2-soft:#2c2614; --g3:#f07a62; --g3-soft:#311b16;
  --bg:#111513; --surface:#1a1f1c; --sunk:#151917; --ink:#e7ebe6; --muted:#9aa49e; --line:#2c3430;
  --accent:#e39a48; --accent-soft:#33261a; --accent-ink:#1a1209;
  --hop:#86c276; --hop-soft:#1f2d1d; --danger:#f0806e; color-scheme:dark}}
:root[data-theme="dark"]{
  --g1:#6fc066; --g1-soft:#1b2a19; --g2:#e7c04a; --g2-soft:#2c2614; --g3:#f07a62; --g3-soft:#311b16;
  --bg:#111513; --surface:#1a1f1c; --sunk:#151917; --ink:#e7ebe6; --muted:#9aa49e; --line:#2c3430;
  --accent:#e39a48; --accent-soft:#33261a; --accent-ink:#1a1209;
  --hop:#86c276; --hop-soft:#1f2d1d; --danger:#f0806e; color-scheme:dark}

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* home */
.brand{display:flex;flex-direction:column;gap:4px;padding-top:8px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.75rem;letter-spacing:.02em;line-height:1.2}
.brand p{margin:0;color:var(--muted);font-size:.9rem}
.label{font-size:.75rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
.methods{display:flex;flex-direction:column;gap:10px}
.method{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.method:active{transform:scale(.99)}
.method svg{width:56px;height:56px;color:var(--accent)}
.method b{display:block;font-size:1.1rem}
.method span{display:block;color:var(--muted);font-size:.85rem;line-height:1.5}
.method i{font-style:normal;color:var(--accent);font-size:1.3rem}
.saved{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.saved-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.saved-row .open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.saved-row .open b{display:block;overflow-wrap:anywhere}
.saved-row .open span{color:var(--muted);font-size:.8rem}
.chip{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.chip.hop{background:var(--hop-soft);color:var(--hop)}
.chip.plain{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.ghost.warn{border-color:var(--danger);color:var(--danger)}
.empty-note{color:var(--muted);font-size:.9rem;padding:12px 0}

/* editor */
.topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{background:var(--surface);border:1px solid var(--line);border-radius:99px;width:38px;height:38px;flex:none;font-size:1.1rem}
.topbar .namebox{flex:1;min-width:0}
.namebox input{width:100%;border:0;background:none;font-family:var(--f-body);font-weight:700;font-size:1.15rem;color:var(--ink);padding:2px 0;border-bottom:1px dashed var(--line);border-radius:0}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.stat b{font-family:var(--f-num);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:.75rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart-wrap{overflow-x:auto}

.steps{display:flex;flex-direction:column;gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step-head{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 10px}
.step-no{font-family:var(--f-num);font-weight:600;font-size:.8rem;color:var(--accent-ink);background:var(--accent);border-radius:6px;min-width:26px;height:26px;display:grid;place-items:center;flex:none}
.step-title{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;display:flex;align-items:center;gap:8px}
.chev{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .15s ease}
.is-open .chev{transform:rotate(90deg);color:var(--accent)}
.tt{flex:1;min-width:0;display:flex;flex-direction:column}
.tt b{font-size:1rem}
.tt span{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon.check{color:var(--muted)}
.icon.check.on{background:var(--hop);border-color:var(--hop);color:var(--surface)}
.is-done .step-no{background:var(--hop)}
.is-done .tt b{color:var(--muted)}
.icons{display:flex;gap:4px;flex:none}
.icon{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:.9rem;display:grid;place-items:center;padding:0}
.icon:disabled{opacity:.35;cursor:default}
.icon.warn{border-color:var(--danger);color:var(--danger);width:auto;padding:0 8px;font-size:.75rem}
.step-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field label{font-size:.75rem;color:var(--muted)}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:0 8px;min-width:0}
.inp input,.inp select{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-family:var(--f-num);font-size:1rem;padding:7px 0;font-variant-numeric:tabular-nums}
.inp input[type=text]{font-family:var(--f-body)}
.inp u{text-decoration:none;color:var(--muted);font-size:.8rem;padding-left:4px;white-space:nowrap}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.listed{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:1fr 84px auto 32px;gap:6px;align-items:center}
.lrow.two{grid-template-columns:1fr 92px 32px}
.lrow .inp input{font-size:.95rem}
.lrow select{font-family:var(--f-body);font-size:.85rem}
.lrow.three{grid-template-columns:minmax(0,1fr) 74px 74px 32px}
.lrow.three .inp{padding:0 6px}
.lhead{font-size:.72rem;color:var(--muted);margin-bottom:-4px}
.calc{background:var(--hop-soft);border-radius:8px;padding:8px 10px;font-size:.84rem;display:flex;flex-direction:column;gap:4px;line-height:1.55}
.calc-res{font-size:.95rem}
.calc .muted{color:var(--muted)}
.gtable-wrap{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px;overflow-x:auto}
.gtable{width:100%;border-collapse:collapse;font-size:.82rem}
.gtable th{font-weight:500;color:var(--muted);font-size:.72rem;text-align:right;padding:2px 4px}
.gtable th:nth-child(2){text-align:left}
.gtable td{padding:5px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.gtable td:nth-child(1){color:var(--muted);width:1.5em}
.gtable td:nth-child(2){text-align:left;white-space:normal}
.gtable tr.r-same td:nth-child(n+3){color:var(--muted)}
.gtable tr.r-calc td:nth-child(4){color:var(--accent);font-weight:600}
.gtable tr.r-meas td:nth-child(4){color:var(--hop);font-weight:600}
.gtable .dot{font-size:.6rem}
.hsec{display:flex;flex-direction:column;gap:8px}
.sub{font-size:.75rem}
.meta{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:end}
.meta input[type=date]{font-family:var(--f-num);font-size:.95rem}
@media (max-width:380px){.meta{grid-template-columns:1fr}}
.mode-note{margin-top:-6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.75rem;color:var(--muted);align-items:center}
.lg-plan{display:inline-block;width:18px;border-top:2px dashed var(--muted);vertical-align:middle}
.act{border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.plan-v{margin-left:auto}
.gtable td.plan{color:var(--muted)!important;font-weight:400!important}
.gtable.is-brew tr.r-calc td:nth-child(5){color:var(--accent);font-weight:600}
.gtable.is-brew tr.r-meas td:nth-child(5){color:var(--hop);font-weight:600}
.gtable .ok{color:var(--hop);font-size:.75rem}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--sunk);gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:7px 4px;font-size:.88rem;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lrow.rest{grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 32px}
.rn{color:var(--muted);font-size:.8rem;text-align:center}
.deco{gap:8px}
.drow{border-top:1px dashed var(--line);padding-top:6px}
.drow.err{color:var(--danger)}
.irow{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.irow-top{display:grid;grid-template-columns:minmax(0,1fr) 32px;gap:6px;align-items:center}
.irow-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.irow-nums.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.irow .inp{padding:0 6px}
.inp.sel select{font-family:var(--f-body);font-size:.92rem;width:100%;text-overflow:ellipsis}
.stats{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:12px}
.groups{display:flex;flex-direction:column;gap:12px}
.group{border:1px solid var(--line);border-radius:14px;background:var(--sunk);overflow:hidden}
.group-head{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:0;padding:12px 12px;border-bottom:1px solid transparent}
.group.is-open .group-head{border-bottom-color:var(--line)}
.gno{font-family:var(--f-display);font-size:1.05rem;color:var(--accent);width:22px;text-align:center;flex:none}
.gt{flex:1;min-width:0;display:flex;flex-direction:column}
.gt b{font-size:1.05rem}
.gt span{font-size:.8rem;color:var(--muted);font-family:var(--f-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group.is-open>.group-head .chev{transform:rotate(90deg);color:var(--accent)}
.group-body{padding:10px;display:flex;flex-direction:column;gap:10px}
.addstep{background:var(--surface);color:var(--accent);border:1px dashed var(--accent);border-radius:var(--r);padding:11px;font-weight:700;width:100%}
.scrim.center{align-items:center;padding:16px}
.dialog{background:var(--surface);border-radius:16px;padding:20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.dialog h2{font-size:1.1rem}
.dlg-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.ghost.big{padding:10px 18px;font-size:.95rem}
.primary.small{width:auto;padding:10px 22px}
.group.g-mash{--gc:var(--g1);--gs:var(--g1-soft)}
.group.g-brew{--gc:var(--g2);--gs:var(--g2-soft)}
.group.g-ferm{--gc:var(--g3);--gs:var(--g3-soft)}
.group{border:2px solid var(--gc);background:var(--gs)}
.group-head{background:var(--gs);box-shadow:inset 6px 0 0 var(--gc)}
.group.is-open .group-head{border-bottom-color:var(--gc)}
.gno{color:var(--gc)}
.group.is-open>.group-head .chev{color:var(--gc)}
.group .addstep{color:var(--gc);border-color:var(--gc)}
.grav-toggle{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 0 0;font-size:.88rem;font-weight:700;color:var(--muted);text-align:left}
.grav-toggle.is-open .chev{transform:rotate(90deg);color:var(--accent)}
.grav-body{display:flex;flex-direction:column;gap:12px}
.htabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--surface);gap:4px}
.htabs button{border:0;background:none;border-radius:9px;padding:10px;font-weight:700;font-size:1rem;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:6px}
.htabs button.on{background:var(--accent);color:var(--accent-ink)}
.htabs .cnt{font-family:var(--f-num);font-size:.75rem;font-weight:500;opacity:.8}
.primary:disabled{opacity:.45}
.picks.one{grid-template-columns:1fr}
.meta{grid-template-columns:repeat(3,minmax(0,1fr))!important;align-items:end}
.meta-note{grid-column:1/-1}
@media (max-width:420px){.meta{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border-radius:16px;padding:18px 16px;min-height:150px;border:2px solid var(--tc);background:var(--ts)}
.tile.t-plan{--tc:var(--accent);--ts:var(--accent-soft)}
.tile.t-brew{--tc:var(--hop);--ts:var(--hop-soft)}
.tile .tl{font-family:var(--f-display);font-size:1.6rem;color:var(--tc);line-height:1.2}
.tile .tn{font-size:1.5rem;font-weight:600;color:var(--ink)}
.tile .tn small{font-size:.8rem;color:var(--muted);font-family:var(--f-body)}
.tile .td{font-size:.82rem;color:var(--muted);line-height:1.45;margin-top:auto}
.tile:active{transform:scale(.99)}
.ltitle{font-size:1.2rem}
.skiprow{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:8px}
.skipbtn{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:6px 14px;font-size:.85rem;font-weight:700;color:var(--muted)}
.skipbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.needbox{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.need{font-size:.78rem;color:var(--muted);line-height:1.35}
.need b{color:var(--accent)}
.need.ok{color:var(--hop)}
.need.warn{color:var(--danger)}
.addrow{align-self:flex-start;background:none;border:1px dashed var(--line);border-radius:8px;padding:5px 12px;font-size:.85rem;color:var(--accent)}
.meas{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.meas-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
textarea{width:100%;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink);padding:7px 8px;resize:vertical;min-height:38px;box-sizing:border-box}
.after{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--sunk);border-top:1px solid var(--line);padding:8px 12px;font-size:.85rem}
.after .num{font-weight:600}
.after .muted{color:var(--muted)}
.helper{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:.88rem;display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.helper button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:5px 12px;font-size:.82rem;font-weight:700}

.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:14px;font-weight:700;font-size:1rem;width:100%}
.secondary{background:var(--surface);color:var(--accent);border:1px solid var(--accent);border-radius:var(--r);padding:12px;font-weight:700;width:100%}
.empty-steps{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px 16px;display:flex;flex-direction:column;gap:12px;text-align:center}
.empty-steps p{margin:0;color:var(--muted);font-size:.9rem}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,11,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:82%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:1.05rem}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.pick b{font-size:.95rem}
.pick span{font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head>
<body>
<div id="app"></div>

<script>
const KEY='brew-notes-v1';
const STYLES={

/* 比重・液量の追跡
   マッシング：このアプリの糖化効率は「モルトの量から、どれだけの比重の麦汁を何L得られるか」を決める係数。
   取り出せるエキス(kg) = Σ モルト量 × 収率 × 糖化効率。それが「得る麦汁量」に溶けているとして比重を求める。
   スパージングの湯量などは途中経過なので計算に使わない。
   ボイル：灰汁で液量が減り（比重は同じ）、蒸発で糖の総量はそのまま濃くなる。澱引きは比重そのまま、加水は薄まる。

/* 水質調整の計算
   酸の必要量：炭酸の平衡（pKa1=6.35）で、原水のアルカリ度を目標pHまで中和するのに要る酸の当量(mEq)を求める。
     アルカリ度 A(mEq/L)=mg/L÷50、全炭酸 CT=A×(1+10^(6.35−原水pH))、目標pHでの重炭酸 = CT÷(1+10^(6.35−目標pH))、必要量 = A − それ
   乳酸88%は1mlで約11.6mEq、リン酸75%は約12.0mEq。
   カルシウムは水のpHはほぼ変えないが、マッシュ中でリン酸と反応して酸性にする（コルバッハ：Ca mEq÷3.5、Mg÷7）ので、その分を酸の当量に換算。
     塩化カルシウム(2水和物)1g≒3.89mEq、石膏1g≒3.32mEq、硫酸マグネシウム1g≒1.16mEq。重曹・炭酸カルシウムはpHを上げる（マイナス）。
   塩化カルシウムは150ppm（150mg/L）まで。
   マッシュpHの推定：麦芽の緩衝作用で、マッシュpH ≒ 5.4 + (水のpH − 5.4)×0.2。
   糖化効率への影響：マッシュpH 5.2〜5.5 は100%、外れると0.1ごとに3%ずつ下がる（入力した糖化効率はpHが最適なときの値とみなす） */
const ADDF={lactic:11.6,phos:12.0,cacl2:3.89,gyp:3.32,mgso4:1.16,nahco3:-11.9,caco3:-14.3,nacl:0};
const CACL2_MAX=150;
function waterCalc(s){
  const V=n(s.p.vol),ph0=n(s.p.ph0)??7,alk=n(s.p.alk)??40,tg=n(s.p.ph);
  const A=alk/50,CT=A*(1+Math.pow(10,6.35-ph0));
  const needL=tg!=null&&tg<ph0?Math.max(0,A-CT/(1+Math.pow(10,6.35-tg))):0;
  const N=V?needL*V:null;
  const items=(s.list||[]).map((it,j)=>({it,j,f:ADDF[it.cat],a:n(it.amt)}));
  const got=items.reduce((t,x)=>t+(x.f&&x.a?x.f*x.a:0),0);
  const rows=items.map(x=>{
    const r={...x,need:null,capped:false,over:false};
    if(x.cat==='cacl2'||x.it.cat==='cacl2'){r.cap=V?CACL2_MAX*V/1000:null;if(x.a&&V&&x.a/V*1000>CACL2_MAX)r.over=true}
    if(N!=null&&x.f>0){
      const others=got-(x.f&&x.a?x.f*x.a:0),rest=N-others;
      let need=Math.max(0,rest/x.f);
      if(x.it.cat==='cacl2'&&r.cap!=null&&need>r.cap){r.capped=true;r.full=need;need=r.cap}
      r.need=need;
    }
    return r;
  });
  let ach=null;
  if(V&&items.some(x=>x.a)){
    const x=got/V,h=A-x;
    if(h>1e-6)ach=6.35+Math.log10(h/Math.max(1e-6,CT-h));
    else ach=Math.max(3,-Math.log10(Math.max(1e-7,(-h)/1000)));
    if(got===0)ach=ph0;
  }
  return {V,ph0,alk,tg,A,N,got,rows,ach,over:N!=null&&got>N*1.05};
}
function waterPH(s,useMeas){
  if(s.p.skip)return {ph:7,how:'省略（pH 7 とみなす）'};
  if(useMeas&&n(s.meas&&s.meas.ph)!=null)return {ph:n(s.meas.ph),how:'実測'};
  const w=waterCalc(s);
  if(w.ach!=null)return {ph:w.ach,how:'添加量から推定'};
  if(w.tg!=null)return {ph:w.tg,how:'目標（添加量が未入力）'};
  return {ph:w.ph0,how:'原水のまま'};
}
const mashPH=wph=>5.4+(wph-5.4)*0.2;
const phFactor=mph=>mph>5.5?Math.max(0.5,1-(mph-5.5)*0.3):mph<5.2?Math.max(0.5,1-(5.2-mph)*0.3):1;
/* カーボネーション
   ビールに残っている炭酸（ガスボリューム）：3.0378 − 0.050062×T + 0.00026555×T²（T=華氏の液温）
   ガス注入の圧力(psi)：−16.6999 − 0.0101059T + 0.00116512T² + 0.173354TV + 4.24267V − 0.0684226V²（V=目標ガスボリューム）
   砂糖で瓶内発酵：上白糖・グラニュー糖 約4 g/L で 1 ボリューム増える */
function carbCalc(s,vol){
  const V=n(s.p.vols),T=n(s.p.temp);if(V==null||T==null)return {};
  const F=T*9/5+32;
  if(s.p.cmethod==='priming'){const res=3.0378-0.050062*F+0.00026555*F*F,sugar=Math.max(0,(V-res)*4.0);return {res,sugar,total:vol!=null?sugar*vol:null,V,T}}
  const psi=-16.6999-0.0101059*F+0.00116512*F*F+0.173354*F*V+4.24267*V-0.0684226*V*V;
  return {psi,kpa:psi*6.89476,bar:psi*0.0689476,V,T};
}
function carbBody(s){
  const pr=s.p.cmethod==='priming';
  return `${seg(s.id,'cmethod',s.p.cmethod,[['forced','ガス注入（CO₂）'],['priming','砂糖（瓶内発酵）']])}
  <div class="fields">${inputHTML(s.id,'p',{k:'vols',l:'目標ガスボリューム',u:'vol'},s.p.vols)}${inputHTML(s.id,'p',{k:'temp',l:pr?'発酵中の最高温度':'ビールの温度',u:'℃'},s.p.temp)}${inputHTML(s.id,'p',{k:'days',l:'日数',u:'日'},s.p.days)}</div>
  <p class="hint">ガスボリュームの目安：ラガー・ピルスナー 2.4〜2.7、エール 2.0〜2.4、ヴァイツェン 3.0〜4.0、スタウト 1.8〜2.2。</p>`;
}
function solveSG(E,V){let lo=1,hi=1.2;for(let k=0;k<60;k++){const m=(lo+hi)/2;if(V*m*plato(m)/100<E)lo=m;else hi=m}return (lo+hi)/2}
/* IBU（Tinseth式）：利用率 = 1.65×0.000125^(平均比重−1) × (1−e^(−0.04×煮沸分))/4.15。
   IBU = 利用率 × α酸(%)/100 × ホップ(g) × 1000 ÷ ボイル後の液量(L)。平均比重はボイル前後の平均。
   冷却後にホップを取り出す場合は、冷却中も苦味が少し出るとみなし、冷却時間の2割（上限10分）を煮沸時間に足す。
   加水すると IBU は薄まる。度数 ABV = (OG − FG) × 131.25。FG = 1 + (OG−1)×(1−発酵度)。
   プライミングの砂糖 1 g/L で約 0.065% 上がる */
function track(steps,useMeas){
  let wph=null,vol=null,sg=null,water=0,kg=0,pot=0,ibu=null,att=null,yeastName='',og=null,fermented=false,prime=0,fgMeas=false;const out=[];
  for(let si=0;si<steps.length;si++){const s=steps[si];
    const before={vol,sg};let changed=false,info=null;
    if(s.type==='water'||s.type==='heat')water+=n(s.p.vol)||0;
    if(s.type==='water'){const w=waterPH(s,useMeas);wph=w;const mp=mashPH(w.ph);info={kind:'water',wph:w.ph,how:w.how,mph:mp,fac:phFactor(mp)}}
    if((s.type==='malt'||s.type==='dissolve')&&s.list)s.list.forEach(it=>{const k=n(it.amt);if(k){kg+=k;pot+=k*(n(it.yld)??DEF.yld)/100}});
    if(s.type==='mash'){
      const eff0=n(s.p.eff)??DEF.eff,V=n(s.p.wort),wp=wph?wph.ph:7,mp=mashPH(wp),fac=phFactor(mp),eff=eff0*fac;
      info={kind:'mash',kg,pot,eff,eff0,fac,mp,wp,noWater:!wph,V};
      if(pot>0&&V>0){const E=pot*eff/100;sg=solveSG(E,V);vol=V;changed=true;Object.assign(info,{E,sg})}
    }
    if(s.type==='dissolve'){
      info={kind:'dissolve',kg,pot,water};
      if(pot>0&&water>0){const P=100*pot/(water+pot);sg=sgFromP(P);vol=(water+pot)/sg;changed=true;Object.assign(info,{E:pot,sg,vol})}
    }
    if(s.type==='boil'){
      const sg0=sg;
      if(vol!=null){const ak=n(s.p.aku),e=n(s.p.evap);
        if(ak){vol=Math.max(0,vol-ak);changed=true}
        if(e&&vol>e){if(sg!=null)sg=1+(sg-1)*vol/(vol-e);vol-=e;changed=true}}
      const coolS=steps.slice(si+1).find(x=>x.type==='cool');
      const extra=s.p.hopOut==='after'?Math.min(10,0.2*((coolS&&n(coolS.p.time))??20)):0;
      const G=sg0!=null&&sg!=null?(sg0+sg)/2:(sg??1.050),V=vol;
      const rows=[];let tot=0;
      (s.hops||[]).forEach(h=>{const a=n(h.alpha),g=n(h.g),t=n(h.t)??0;if(a&&g&&V){const u=1.65*Math.pow(0.000125,G-1)*(1-Math.exp(-0.04*(t+extra)))/4.15,v=u*a/100*g*1000/V;tot+=v;rows.push({name:h.name||'ホップ',a,g,t,ibu:v})}});
      info={kind:'boil',rows,tot,G,V,extra,assumed:sg==null,hopOut:s.p.hopOut};
      if(rows.length){ibu=tot}
    }
    let dbase=null;
    if(s.type==='trub'){const l=n(s.p.loss);if(l&&vol!=null){vol=Math.max(0,vol-l);changed=true}
      dbase={vol,sg};const a=n(s.p.add);if(a&&vol!=null){if(sg!=null)sg=1+(sg-1)*vol/(vol+a);if(ibu!=null)ibu*=vol/(vol+a);vol+=a;changed=true}}
    if(s.type==='dilute'){const a=n(s.p.add);if(a&&vol!=null){if(sg!=null)sg=1+(sg-1)*vol/(vol+a);if(ibu!=null)ibu*=vol/(vol+a);vol+=a;changed=true}}
    if(s.type==='yeast'){att=n(s.p.atten)??DEF.att;yeastName=s.p.name||''}
    if(s.type==='ferment1'&&!fermented&&sg!=null){og=sg;const a=att??DEF.att;sg=1+(og-1)*(1-a/100);fermented=true;changed=true;info={kind:'ferment',og,att:a,assumed:att==null,yeast:yeastName}}
    if(s.type==='bottle'&&fermented){prime=n(s.p.sugar)||0;info={kind:'bottle',prime}}
    if(s.type==='carbonation'){const c=carbCalc(s,vol);info={kind:'carb',...c};if(fermented&&c.sugar!=null&&s.p.cmethod==='priming'){prime+=c.sugar;info.prime=c.sugar}}
    let src=changed?'calc':null;
    if(useMeas){
      const mv=n(s.meas&&s.meas.vol),ms=n(s.meas&&s.meas.sg);
      if(mv!=null){vol=mv;src='meas'}
      if(ms!=null){sg=ms;src='meas'}
      if(s.type==='mash'&&info&&pot>0&&(mv!=null||ms!=null)&&vol!=null&&sg!=null){info.actEff=vol*sg*plato(sg)/100/pot*100;info.actVol=vol;info.actSg=sg;info.volGuessed=mv==null}
      if(fermented&&ms!=null)fgMeas=true;
    }
    const abv=fermented&&og!=null&&sg!=null?(og-sg)*131.25+prime*0.0646:null;
    if(info&&info.kind==='ferment'){info.fg=sg;info.abv=(og-sg)*131.25;info.meas=src==='meas'}
    if(info&&info.kind==='carb'&&info.prime){info.abv=abv}
    if(info&&info.kind==='bottle'){info.abv=abv;info.base=abv!=null?abv-prime*0.0646:null}
    out.push({before,dbase:dbase||before,vol,sg,src,info,ibu,abv});
  }
  let m={vol:null,og,fg:null,abv:null,ibu,fgMeas,prime,predicted:!fermented};
  const last=[...out].reverse().find(x=>x.vol!=null||x.sg!=null);if(last)m.vol=last.vol;
  if(fermented){m.fg=out[out.length-1].sg;m.abv=out[out.length-1].abv}
  else{const lsg=[...out].reverse().find(x=>x.sg!=null);if(lsg){m.og=lsg.sg;const a=att??DEF.att;m.fg=1+(m.og-1)*(1-a/100);m.abv=(m.og-m.fg)*131.25}}
  out.meta=m;
  return out;
}
/* デコクション：取り出した分を100℃にして戻し、全体を目標温度にする。
   マッシュ全体（水＋モルト）の熱容量はほぼ体積に比例するとみなし、取り出す割合 = (目標 − 今の温度) / (100 − 今の温度)。
   マッシュの体積 = マッシュ水量 + モルト × 0.67 L/kg。
   火力：1.5 L を 50℃→100℃ に上げるのに「火力」分かかる、つまり 1分で 1.5×50÷火力 (L·℃) 温められる */
function decoPlan(s,kg){
  const W=n(s.p.mashWater),T0=n(s.p.startTemp),fire=n(s.p.fire)||5,rate=1.5*50/fire;
  if(!W||T0==null)return null;
  const V=W+kg*0.67;let T=T0;const rows=[];
  for(const d of s.decs){const Tt=n(d.target);
    if(Tt==null||Tt<=T||Tt>=100){rows.push({err:Tt==null?'目標温度を入れてください':'今の温度（'+T+'℃）より高く、100℃より低くしてください',T});continue}
    const f=(Tt-T)/(100-T),Vd=f*V,heat=Vd*(100-T)/rate;rows.push({from:T,to:Tt,Vd,heat,f,rest:n(d.time)||0});T=Tt}
  return {V,rows,rate};
}
function stepTime(s,kg){
  if(s.type!=='mash')return n(s.p.time)||0;
  if(s.p.method==='decoction'){const d=decoPlan(s,kg);let t=n(s.p.startTime)||0;(s.decs||[]).forEach((x,i)=>{t+=n(x.time)||0;const r=d&&d.rows[i];if(r&&!r.err)t+=r.heat});return Math.round(t)}
  return (s.rests||[]).reduce((a,x)=>a+(n(x.time)||0),0);
}
function kgBefore(steps,idx){let kg=0;steps.slice(0,idx).forEach(s=>{if((s.type==='malt'||s.type==='dissolve')&&s.list)s.list.forEach(it=>kg+=n(it.amt)||0)});return kg}
function totalTime(steps){return steps.reduce((a,s,i)=>a+stepTime(s,kgBefore(steps,i)),0)}
function totalDays(steps){return steps.reduce((a,s)=>a+(n(s.p.days)||0),0)}

function stepSummary(s){
  const t=TYPES[s.type],bits=[];
  if(s.type==='mash'){
    if(s.p.method==='decoction')bits.push(`デコクション ${s.decs.length}回（${[s.p.startTemp,...s.decs.map(d=>d.target)].filter(Boolean).join('→')}℃）`);
    else bits.push('インフュージョン '+s.rests.filter(r=>r.temp).map(r=>`${r.temp}℃${r.time?r.time+'分':''}`).join('→'));
    if(s.p.eff)bits.push(`効率 ${s.p.eff}%`);if(s.p.wort)bits.push(`麦汁 ${s.p.wort}L`);
    return bits.join(' · ');
  }
  if(s.type==='yeast'){if(s.p.name)bits.push(s.p.name);if(s.p.atten)bits.push(`発酵度 ${s.p.atten}%`)}
  if(s.type==='carbonation'){bits.push(s.p.cmethod==='priming'?'砂糖（瓶内発酵）':'ガス注入');if(s.p.vols)bits.push(`${s.p.vols} vol`);if(s.p.temp)bits.push(`${s.p.temp}℃`);if(s.p.days)bits.push(`${s.p.days}日`)}
  (t.fields||[]).forEach(f=>{const v=s.p[f.k];if(v!==''&&v!=null)bits.push(f.t==='text'?v:`${f.l} ${v}${f.u==='SG'||f.u==='pH'?'':f.u}`)});
  if(s.hops&&s.hops.length)bits.push(s.hops.filter(h=>h.name).map(h=>`${h.name}${h.g?' '+h.g+'g':''}${s.type==='boil'&&h.t!==''?' '+h.t+'分':''}`).join('、'));
  if(s.list){const it=s.list.filter(x=>x.name);if(it.length)bits.push(it.map(x=>x.name+(x.amt?` ${x.amt}${x.unit||'kg'}`:'')).join('、'))}
  return bits.join(' · ')||t.sub;
}

function editorHTML(){
  const r=cur(),brew=isBrew();
  const tr=track(r.steps,brew),pt=brew?planRows(r):null,pm=brew?track(r.plan||[],false).meta:null;
  const onlyDefaults=r.steps.every(x=>['water','malt','dissolve','heat'].includes(x.type));
  return `<div class="topbar"><button class="back" data-act="back" aria-label="戻る">‹</button>
    <div class="namebox"><input id="rname" type="text" data-f="doc|name" value="${esc(r.name)}" placeholder="${brew?'仕込みの名前':'レシピの名前'}"></div>
    <span class="chip ${brew?'hop':''}">${brew?'醸造':'計画'}</span></div>
  ${brew?`<div class="meta"><div class="field"><label for="bdate">醸造日</label><div class="inp"><input id="bdate" type="date" data-f="doc|date" value="${esc(r.date)}"></div></div>
    <div class="field"><label for="bdone">完成予定日</label><div class="inp"><input id="bdone" type="date" data-f="doc|doneDate" value="${esc(r.doneDate||'')}"></div></div>
    <div class="field"><label for="bfin">完成した日</label><div class="inp"><input id="bfin" type="date" data-f="doc|finDate" value="${esc(r.finDate||'')}"></div></div>
    <p class="hint meta-note" id="done-hint">${doneHint(r)}</p>
    <p class="hint meta-note">${STYLES[r.style].name}${(()=>{const src=db.recipes.find(x=>x.id===r.rid);return src?` · 元のレシピ「${esc(src.name)}」`:''})()}<br>工程の数値は実際の値に書き換えられます。予定はレシピを始めた時点のものです。</p></div>`
    :`<p class="hint mode-note">${STYLES[r.style].name}のレシピを計画します。醸造する日は「このレシピで醸造を始める」を押すと、醸造の記録が作られます。</p>`}
  <section class="summary" id="summary">${summaryInner(r,tr,pt,pm)}</section>
  ${brew?'':`<button class="secondary" data-act="startBrew">このレシピで醸造を始める</button>`}
  ${onlyDefaults?`<div class="empty-steps"><p>${STYLES[r.style].name}の標準的な工程をまとめて入れるか、下の各項目から1つずつ追加できます。</p><button class="secondary" data-act="tpl">標準の工程をまとめて追加</button></div>`:''}
  <div class="groups">${GROUPS.map(g=>groupHTML(r,g,tr,pt)).join('')}</div>`;
}
function groupSummary(g,r,tr){
  const idx=r.steps.map((s,i)=>gOf(s)===g?i:-1).filter(i=>i>=0);
  if(!idx.length)return '工程なし';
  const last=tr[idx[idx.length-1]],m=tr.meta,bits=[`${idx.length} 工程`];
  if(g==='mash'&&last.sg!=null)bits.push(`${fv(last.vol)} L · SG ${fsg(last.sg)}`);
  if(g==='brew'){if(last.sg!=null)bits.push(`OG ${fsg(last.sg)}`);if(last.ibu!=null)bits.push(`${Math.round(last.ibu)} IBU`)}
  if(g==='ferm'){if(m.fg!=null&&!m.predicted)bits.push(`FG ${fsg(m.fg)}`);if(m.abv!=null&&!m.predicted)bits.push(`${m.abv.toFixed(1)}%`);const d=r.steps.filter(s=>gOf(s)==='ferm').reduce((a,s)=>a+(n(s.p.days)||0),0);if(d)bits.push(`${d} 日`)}
  if(isBrew()){const dn=idx.filter(i=>r.steps[i].done).length;bits.push(dn===idx.length?'完了':`${dn}/${idx.length} 完了`)}
  return bits.join(' · ');
}
function groupHTML(r,g,tr,pt){
  r.collapsed=r.collapsed||{};const closed=!!r.collapsed[g];
  const items=r.steps.map((s,i)=>[s,i]).filter(([s])=>gOf(s)===g);
  const no={mash:'1',brew:'2',ferm:'3'}[g];
  return `<section class="group g-${g} ${closed?'':'is-open'}" id="grp-${g}">
    <button class="group-head" data-act="gtoggle" data-g="${g}" aria-expanded="${!closed}">${CHEV}<span class="gno">${no}</span><span class="gt"><b>${gName(g,r.style)}</b><span id="gsum-${g}">${esc(groupSummary(g,r,tr))}</span></span></button>
    ${closed?'':`<div class="group-body">${items.length?`<div class="steps">${items.map(([s,i],k)=>stepHTML(r,s,i,tr[i],pt&&pt[s.id],k===0,k===items.length-1)).join('')}</div>`:'<p class="hint">この項目の工程はまだありません。</p>'}
      <button class="addstep" data-act="sheet" data-g="${g}">＋ ${g==='mash'?(r.style==='extract'?'準備':'マッシング'):g==='brew'?'仕込み':'発酵・熟成'}の工程を追加</button></div>`}
  </section>`;
}
function addDays(d,k){const t=new Date(d+'T00:00:00');if(isNaN(t))return '';t.setDate(t.getDate()+k);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`}
function autoDone(b){const d=totalDays(b.steps);return b.date&&d?addDays(b.date,d):''}
function doneHint(b){const a=autoDone(b);return a?`醸造日に発酵・熟成の日数（${totalDays(b.steps)} 日）を足すと ${a.replace(/-/g,'/')}。${b.doneAuto===false?'完成予定日は手で変更しています。':'日数を変えると完成予定日も自動で変わります。'}`:'発酵・熟成の工程に日数を入れると、完成予定日を自動で計算します。'}
function syncDone(b){if(b.doneAuto!==false)b.doneDate=autoDone(b)}
function planRows(b){const t=track(b.plan||[],false),m={};(b.plan||[]).forEach((s,i)=>m[s.id]=t[i]);return m}

function summaryInner(r,tr,pt,pm){
  const brew=!!pt,m=tr.meta;
  const tt=totalTime(r.steps),td=totalDays(r.steps),dn=r.steps.filter(s=>s.done).length;
  const series=[];
  if(brew)series.push({pts:r.steps.map((s,i)=>({i,sg:pt[s.id]?pt[s.id].sg:null,src:'plan'})).filter(x=>x.sg!=null),plan:true});
  series.push({pts:tr.map((x,i)=>({i,sg:x.sg,src:x.src})).filter(x=>x.sg!=null)});
  const pl=(v,f)=>brew&&pm&&pm[v]!=null?`予定 ${f(pm[v])}`:'';
  const tile=(l,v,e)=>`<div class="stat"><small>${l}</small><b>${v}</b><em>${e||'&nbsp;'}</em></div>`;
  return `<div class="stats">
    ${tile(brew?'最終液量':'予定の最終液量',`${m.vol!=null?fv(m.vol):'—'}<span class="sub"> L</span>`,pl('vol',v=>fv(v)+' L'))}
    ${tile('OG（仕込み終了時）',fsg(m.og),m.og!=null?plato(m.og).toFixed(1)+' °P':'')}
    ${tile(m.fgMeas?'FG（実測）':'FG（予想）',fsg(m.fg),pl('fg',fsg)||(m.fg!=null?plato(m.fg).toFixed(1)+' °P':''))}
    ${tile('アルコール度数',m.abv!=null?m.abv.toFixed(1)+'<span class="sub"> %</span>':'—',pl('abv',v=>v.toFixed(1)+'%')||(m.prime?'プライミング込み':m.predicted&&m.abv!=null?'発酵度から予想':''))}
    ${tile('苦味',m.ibu!=null?Math.round(m.ibu)+'<span class="sub"> IBU</span>':'—',pl('ibu',v=>Math.round(v)+' IBU'))}
    ${brew?tile('進み具合',`${dn}<span class="sub">/${r.steps.length}</span>`,'工程が完了')
      :tile('仕込み日の作業',tt?Math.floor(tt/60)+':'+String(tt%60).padStart(2,'0'):'—',td?`発酵・熟成 ${td} 日`:`${r.steps.length} 工程`)}
  </div>
  <button class="grav-toggle ${r.showGrav?'is-open':''}" data-act="gravToggle" aria-expanded="${!!r.showGrav}">${CHEV}<span>比重の推移と工程ごとの比重</span></button>
  ${r.showGrav?`<div class="grav-body">${chartSVG(r.steps.length,series,brew)}${gravTable(r,tr,pt)}</div>`:''}`;
}

function chartSVG(N,series,brew){
  const all=series.flatMap(s=>s.pts);
  if(!all.length)return `<p class="hint">モルト投入にモルトの量、マッシングに糖化効率と得る麦汁量を入れると、各工程の比重を計算してここに推移を表示します。</p>`;
  const W=520,H=130,L=40,R=12,Tp=12,B=26;
  let lo=Math.min(...all.map(p=>p.sg)),hi=Math.max(...all.map(p=>p.sg));
  if(hi-lo<0.006){const m=(hi+lo)/2;lo=m-0.004;hi=m+0.004}
  const pad=(hi-lo)*.15;lo-=pad;hi+=pad;
  const x=i=>L+(N<=1?0.5:i/(N-1))*(W-L-R),y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);
  let s=`<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="工程ごとの比重の推移">`;
  [hi-pad,(hi+lo)/2,lo+pad].forEach(t=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${t.toFixed(3)}</text>`});
  for(let i=0;i<N;i++)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${i+1}</text>`;
  series.forEach(se=>{
    const pts=se.pts;
    if(pts.length>1)s+=`<polyline points="${pts.map(p=>x(p.i)+','+y(p.sg)).join(' ')}" fill="none" stroke="${se.plan?'var(--muted)':'var(--accent)'}" stroke-width="${se.plan?1.5:2}" ${se.plan?'stroke-dasharray="4 4"':''} stroke-linejoin="round"/>`;
    if(!se.plan)pts.forEach(p=>{const m=p.src==='meas';s+=`<circle cx="${x(p.i)}" cy="${y(p.sg)}" r="${m?4.5:3.5}" fill="${m?'var(--hop)':'var(--surface)'}" stroke="${m?'var(--hop)':'var(--accent)'}" stroke-width="2"/>`});
  });
  s+=`</svg></div><div class="legend">${brew?'<span><i class="lg-plan"></i> 予定</span><span><span style="color:var(--hop)">●</span> 実測</span><span><span style="color:var(--accent)">○</span> 計算</span>':'<span><span style="color:var(--accent)">○</span> 計算</span>'}<span>横軸は工程番号</span></div>`;
  return s;
}

function gravTable(r,tr,pt){
  if(!tr.some(x=>x.sg!=null))return '';
  const brew=!!pt;
  return `<div class="gtable-wrap"><div class="label">工程ごとの比重</div><table class="gtable ${brew?'is-brew':''}"><thead><tr><th></th><th>工程</th><th>液量</th>${brew?'<th>予定</th><th>実際</th>':'<th>比重</th><th>°P</th>'}</tr></thead><tbody>${r.steps.map((s,i)=>{const t=tr[i],p=pt&&pt[s.id];
    const cls=t.src==='meas'?'r-meas':t.src==='calc'?'r-calc':'r-same';
    return `<tr class="${cls}"><td class="num">${i+1}</td><td>${esc(stepName(s))}${brew&&s.done?' <span class="ok">✓</span>':''}</td><td class="num">${t.vol!=null?fv(t.vol)+' L':'—'}</td>${brew
      ?`<td class="num plan">${p?fsg(p.sg):'—'}</td><td class="num">${fsg(t.sg)}${t.src==='meas'?' <span class="dot">●</span>':''}</td>`
      :`<td class="num">${fsg(t.sg)}</td><td class="num">${t.sg!=null?plato(t.sg).toFixed(1):'—'}</td>`}</tr>`}).join('')}</tbody></table></div>`;
}

function inputHTML(sid,group,f,val){

}

function stepHTML(r,s,i,t,p,first,last){
  const ty=TYPES[s.type],brew=isBrew();

    <div class="icons">${brew?`<button class="icon check ${s.done?'on':''}" data-act="done" data-id="${s.id}" aria-label="${s.done?'完了を取り消す':'完了にする'}">✓</button>`:''}<button class="icon" data-act="up" data-id="${s.id}" ${first?'disabled':''} aria-label="上へ">↑</button><button class="icon" data-act="down" data-id="${s.id}" ${last?'disabled':''} aria-label="下へ">↓</button>
    <button class="icon ${armed===s.id?'warn':''}" data-act="dels" data-id="${s.id}" aria-label="削除">${armed===s.id?'削除する':'✕'}</button></div></div>`;
  if(s.open){
    h+=`<div class="step-body">`;
    if(s.type==='custom')h+=`<div class="field"><label for="${s.id}-title">工程名</label><div class="inp"><input id="${s.id}-title" type="text" data-f="${s.id}|title" value="${esc(s.title)}" placeholder="例：ホップスタンド"></div></div>`;
    if(s.type==='water')h+=waterBody(s);
    else if(s.type==='carbonation')h+=carbBody(s);
    else if(ty.fields&&ty.fields.length)h+=`<div class="fields">${ty.fields.map(f=>inputHTML(s.id,'p',f,s.p[f.k])).join('')}</div>`;

    if(s.type==='dilute'||s.type==='trub')h+=`<div id="help-${s.id}">${diluteHelp(s,t)}</div>`;
    if(['mash','dissolve','boil','ferment1','bottle','carbonation'].includes(s.type))h+=`<div id="info-${s.id}">${calcInfo(t)}</div>`;
    if(s.type==='cool'){const bo=r.steps.slice(0,i).reverse().find(x=>x.type==='boil');if(bo&&bo.hops&&bo.hops.length)h+=`<p class="hint">ホップは${bo.p.hopOut==='after'?'この冷却の<b>後</b>':'この冷却の<b>前</b>'}に取り出す設定です（ボイルの工程で変更できます）。</p>`}
    if(brew)h+=`<div class="meas"><div class="meas-head"><span class="label">${s.type==='water'?'調整後の実測':'この工程後の実測'}</span><span class="hint">わかる時だけ</span></div>
      <div class="fields">${s.type==='water'?inputHTML(s.id,'meas',{k:'ph',l:'pH',u:'pH',step:'0.01'},s.meas.ph||''):inputHTML(s.id,'meas',{k:'vol',l:'液量',u:'L'},s.meas.vol)+inputHTML(s.id,'meas',{k:'sg',l:'比重',u:'SG',step:'0.001'},s.meas.sg)}</div></div>`;
    h+=`<textarea id="${s.id}-memo" data-f="${s.id}|memo" rows="1" placeholder="メモ">${esc(s.memo)}</textarea></div>`;
  }
  h+=`<div class="after" id="after-${s.id}">${s.type==='water'?phHTML(s,brew,p):afterHTML(t,p,brew)}</div></article>`;
  return h;
}
function waterBody(s){
  const sk=!!s.p.skip;
  let h=`<div class="fields">${inputHTML(s.id,'p',{k:'vol',l:'水量',u:'L'},s.p.vol)}${sk?'':inputHTML(s.id,'p',{k:'ph',l:'目標pH',u:'pH',step:'0.01'},s.p.ph)}</div>
  <div class="skiprow"><span class="label">pH調整</span><button class="skipbtn ${sk?'on':''}" data-act="wskip" data-id="${s.id}" aria-pressed="${sk}">${sk?'省略中（押すと調整する）':'省略する'}</button></div>`;
  if(sk)return h+`<p class="hint">pH調整を省略しています。水のpHは 7 として、マッシングの効率を計算します。</p>`;
  h+=`<div class="fields">${inputHTML(s.id,'p',{k:'ph0',l:'原水のpH',u:'pH',step:'0.01'},s.p.ph0)}${inputHTML(s.id,'p',{k:'alk',l:'原水のアルカリ度',u:'mg/L'},s.p.alk)}</div>
  <p class="hint">アルカリ度（炭酸カルシウム換算）は水道局の水質データに載っています。わからなければ 40 のままで構いません。</p>
  <div class="listed"><span class="label">添加剤</span><div id="wadd-${s.id}">${waterAddHTML(s)}</div>
  <button class="addrow" data-act="addItem" data-g="list" data-id="${s.id}">＋ 添加剤を追加</button></div>`;
  return h;
}
function waterAddHTML(s){
  const w=waterCalc(s);
  const rows=w.rows.map(r=>{
    const it=r.it,base=`${s.id}|list|${r.j}`,custom=it.cat==='custom',unit=it.unit||'g';
    let need='';
    if(r.f>0&&w.N!=null)need=r.need<0.005?`<span class="need ok">目標に達しています</span>`:`<span class="need">目標pHに必要 <b class="num">${r.need.toFixed(unit==='ml'?2:1)} ${unit}</b>${r.capped?`（150ppmの上限。これだけでは足りません）`:''}</span>`;
    else if(r.f<0)need=`<span class="need warn">pHを上げる添加剤です</span>`;
    else if(it.cat&&!custom&&r.f===0)need=`<span class="need">pHにはほぼ影響しません</span>`;
    const over=r.over?`<span class="need warn">150ppm（${(CACL2_MAX*w.V/1000).toFixed(1)} g）を超えています</span>`:'';
    return `<div class="irow"><div class="irow-top"><div class="inp sel">${catSelect('add',base,it.cat)}</div><button class="icon" data-act="delItem" data-g="list" data-id="${s.id}" data-j="${r.j}" aria-label="行を削除">✕</button></div>
      ${custom?`<div class="inp"><input type="text" id="${base.replace(/\|/g,'-')}-name" aria-label="名前" data-f="${base}|name" value="${esc(it.name)}" placeholder="名前を入力"></div>`:''}
      <div class="irow-nums two"><div class="inp">${numIn(base,'amt',it.amt,r.need!=null&&r.need>0.005?r.need.toFixed(unit==='ml'?2:1):'','量')}<u>${unit}</u></div><div class="needbox" id="need-${s.id}-${r.j}">${need}${over}</div></div></div>`;
  }).join('');
  let sum='';
  if(!w.V)sum=`<p class="hint">水量を入れると、目標pHに必要な添加量を計算します。</p>`;
  else if(w.tg==null)sum=`<p class="hint">目標pHを入れると、必要な添加量を計算します。</p>`;
  else{
    const ach=w.ach!=null?w.ach:w.ph0;
    sum=`<div class="calc"><div>目標 pH <span class="num">${w.tg.toFixed(2)}</span> に必要な酸 <span class="num">${w.N.toFixed(1)} mEq</span>（原水 pH ${w.ph0}・アルカリ度 ${w.alk} mg/L・${w.V} L）</div>
      <div class="calc-res">入力した量での推定 pH <b class="num">${ach.toFixed(2)}</b>${w.over?' <span class="need warn">目標より下がりすぎます</span>':''}</div>
      <div class="muted">どれか1つに量を入れると、残りの添加剤の「目標pHに必要」な量が、その分を引いた量に変わります。カルシウムの効果はマッシュ中で効く分を酸に換算しています。</div></div>`;
  }
  return rows+`<div id="wsum-${s.id}">${sum}</div>`;
}
/* 入力中の欄は描き直さず、計算結果の部分だけ更新する */
function waterRefresh(s){

  tmp.querySelectorAll('[id^="need-"],[id^="wsum-"]').forEach(el=>{const cur=document.getElementById(el.id);if(cur)cur.innerHTML=el.innerHTML});
}
function phHTML(s,brew,pp){
  const w=waterPH(s,brew),mp=mashPH(w.ph),f=phFactor(mp);
  return `<span class="muted">水のpH</span><span class="num">${w.ph.toFixed(2)}</span><span class="chip ${w.how==='実測'?'hop':'plain'}">${w.how}</span><span class="muted">マッシュpH</span><span class="num">${mp.toFixed(2)}</span>${f<1?`<span class="chip">効率 −${Math.round((1-f)*100)}%</span>`:''}`;
}
function phHTML_old(s,brew,pp){
  const p0=n(s.p.ph0),p1=n(s.p.ph),pm=brew?n(s.meas.ph):null;
  if(p0==null&&p1==null&&pm==null)return `<span class="muted">pH：未入力</span>`;
  return `<span class="muted">pH</span><span class="num">${p0!=null?p0.toFixed(2):'—'}</span><span class="muted">→</span><span class="num">${pm!=null?pm.toFixed(2):p1!=null?p1.toFixed(2):'—'}</span>${pm!=null?'<span class="chip hop">実測</span>':p1!=null?'<span class="chip plain">目標</span>':''}${brew&&pm!=null&&p1!=null?`<span class="muted plan-v">目標 <span class="num">${p1.toFixed(2)}</span></span>`:''}`;
}
function seg(sid,key,val,opts){return `<div class="seg" role="radiogroup">${opts.map(([v,l])=>`<button role="radio" aria-checked="${val===v}" class="${val===v?'on':''}" data-act="seg" data-id="${sid}" data-k="${key}" data-v="${v}">${l}</button>`).join('')}</div>`}
function mashBody(s,t){
  const kg=t.info?t.info.kg:0,isDec=s.p.method==='decoction';
  let h=seg(s.id,'method',s.p.method,[['infusion','インフュージョン'],['decoction','デコクション']]);

  <p class="hint">得る麦汁量は、スパージングまで終えてボイルに入る前の麦汁の量です。</p>`;
  if(!isDec){
    h+=`<div class="listed"><span class="label">温度と時間（ステップインフュージョン）</span><div class="lrow rest lhead"><span></span><span>温度</span><span>時間</span><span></span></div>${s.rests.map((r,j)=>`<div class="lrow rest"><span class="num rn">${j+1}</span>
      <div class="inp"><input type="number" inputmode="decimal" step="any" id="${s.id}-r${j}-t" aria-label="温度" data-f="${s.id}|rest|${j}|temp" value="${esc(r.temp)}"><u>℃</u></div>
      <div class="inp"><input type="number" inputmode="decimal" step="any" id="${s.id}-r${j}-m" aria-label="時間" data-f="${s.id}|rest|${j}|time" value="${esc(r.time)}"><u>分</u></div>
      <button class="icon" data-act="delRest" data-id="${s.id}" data-j="${j}" aria-label="段を削除" ${s.rests.length<2?'disabled':''}>✕</button></div>`).join('')}
      <button class="addrow" data-act="addRest" data-id="${s.id}">＋ 段を追加</button></div>`;
    return h;
  }
  h+=`<div class="fields">${inputHTML(s.id,'p',{k:'mashWater',l:'マッシュ水量',u:'L'},s.p.mashWater)}${inputHTML(s.id,'p',{k:'startTemp',l:'最初の休止温度',u:'℃'},s.p.startTemp)}${inputHTML(s.id,'p',{k:'startTime',l:'最初の休止時間',u:'分'},s.p.startTime)}
    <div class="field"><label for="${s.id}-decN">デコクション回数</label><div class="inp"><select id="${s.id}-decN" data-f="${s.id}|decN">${[1,2,3].map(k=>`<option value="${k}" ${s.decs.length===k?'selected':''}>${k} 回</option>`).join('')}</select></div></div></div>
    <div class="listed"><span class="label">戻したあとの目標温度と休止時間</span><div class="lrow rest lhead"><span></span><span>目標温度</span><span>休止時間</span><span></span></div>${s.decs.map((d,j)=>`<div class="lrow rest"><span class="num rn">${j+1}</span>
      <div class="inp"><input type="number" inputmode="decimal" step="any" id="${s.id}-d${j}-t" aria-label="目標温度" data-f="${s.id}|dec|${j}|target" value="${esc(d.target)}"><u>℃</u></div>
      <div class="inp"><input type="number" inputmode="decimal" step="any" id="${s.id}-d${j}-m" aria-label="休止時間" data-f="${s.id}|dec|${j}|time" value="${esc(d.time)}"><u>分</u></div><span></span></div>`).join('')}</div>
    <div class="fields">${inputHTML(s.id,'p',{k:'fire',l:'火力（1.5 L を 50→100℃ にかかる時間）',u:'分'},s.p.fire)}</div>
    <div id="deco-${s.id}">${decoHTML(s,kg)}</div>`;
  return h;
}
function decoHTML(s,kg){
  const d=decoPlan(s,kg);
  if(!d)return `<p class="hint">マッシュ水量と最初の休止温度を入れると、デコクションで取り出す量を計算します。</p>`;
  return `<div class="calc deco"><div>マッシュの量 <span class="num">${fv(d.V)} L</span>（水 ${esc(s.p.mashWater)} L ＋ モルト ${kg.toFixed(1)} kg）。取り出した分は100℃まで加熱して戻します。</div>
    ${d.rows.map((r,i)=>r.err?`<div class="drow err">${i+1}回目：${r.err}</div>`:`<div class="drow"><b>${i+1}回目</b>　<span class="num">${r.from}℃</span> のマッシュから <b class="num">${r.Vd.toFixed(1)} L</b> 取り出す（全体の ${Math.round(r.f*100)}%）<br>100℃まで約 <b class="num">${Math.round(r.heat)} 分</b> → 戻して <b class="num">${r.to}℃</b>、${r.rest} 分休止</div>`).join('')}
    <div class="muted">マッシング全体の目安 <span class="num">${stepTime(s,kg)} 分</span>（煮沸を続ける時間は含みません）</div></div>`;
}
function afterHTML(t,p,brew){
  const plan=brew&&p&&p.sg!=null?`<span class="muted plan-v">予定 <span class="num">${fsg(p.sg)}</span></span>`:'';
  if(t.vol==null&&t.sg==null)return `<span class="muted">工程後の液量・比重：まだ計算できません</span>${plan}`;
  const chip=t.src==='meas'?'<span class="chip hop">実測</span>':t.src==='calc'?'<span class="chip">計算</span>':'<span class="chip plain">前工程のまま</span>';
  return `<span class="muted">工程後</span><span class="num">${fv(t.vol)} L</span><span class="num">SG ${fsg(t.sg)}</span>${t.sg!=null?`<span class="num muted">${plato(t.sg).toFixed(1)}°P</span>`:''}${chip}${plan}`;
}
function calcInfo(t){
  const i=t.info;if(!i)return '';
  if(i.kind==='carb'){
    if(i.V==null)return `<p class="hint">目標ガスボリュームと温度を入れると計算します。</p>`;
    if(i.psi!=null)return `<div class="calc"><div>${i.T}℃ で <span class="num">${i.V} vol</span> にするには</div><div class="calc-res">→ 圧力 <b class="num">${i.bar.toFixed(2)} bar</b>（${Math.round(i.kpa)} kPa・${i.psi.toFixed(1)} psi）</div><div class="muted">この圧力をかけたまま、${i.T}℃で数日置くと炭酸が溶け込みます。</div></div>`;
    return `<div class="calc"><div>発酵後に残っている炭酸 <span class="num">${i.res.toFixed(2)} vol</span>（最高 ${i.T}℃）→ 目標 <span class="num">${i.V} vol</span></div><div class="calc-res">→ 砂糖 <b class="num">${i.sugar.toFixed(1)} g/L</b>${i.total!=null?`（全体で <b class="num">${Math.round(i.total)} g</b>）`:''}</div>${i.abv!=null?`<div class="muted">砂糖の分で度数が約 ${(i.sugar*0.0646).toFixed(2)}% 上がり、最終 <b class="num">${i.abv.toFixed(1)}%</b>。</div>`:''}</div>`;
  }
  if(i.kind==='boil'){
    if(!i.rows.length)return `<p class="hint">ホップを選び、量と煮沸時間を入れると IBU を計算します。</p>`;
    return `<div class="calc"><div>${i.rows.map(r=>`${esc(r.name)} <span class="num">${r.g} g・α${r.a}%・${r.t}分</span> → <b class="num">${r.ibu.toFixed(1)}</b>`).join('<br>')}</div><div class="calc-res">→ 合計 <b class="num">${Math.round(i.tot)} IBU</b></div><div class="muted">ボイル後 <span class="num">${fv(i.V)} L</span>・平均比重 <span class="num">${fsg(i.G)}</span>${i.assumed?'（比重がわからないため1.050と仮定）':''}で計算。${i.extra?`冷却後に取り出すので、冷却中に出る苦味として各ホップに約 ${i.extra.toFixed(0)} 分を足しています。`:''}</div></div>`;
  }
  if(i.kind==='ferment'){
    return `<div class="calc"><div>OG <span class="num">${fsg(i.og)}</span> × 発酵度 <span class="num">${i.att}%</span>${i.yeast?`（${esc(i.yeast)}）`:''}${i.assumed?'（酵母投入の工程がないため75%と仮定）':''}</div><div class="calc-res">→ FG <b class="num">${fsg(i.fg)}</b>${i.meas?'（実測）':''} → 度数 <b class="num">${i.abv.toFixed(1)}%</b></div></div>`;
  }
  if(i.kind==='bottle'){
    if(i.abv==null)return '';
    return `<div class="calc"><div>発酵後 <span class="num">${i.base.toFixed(1)}%</span> ＋ 砂糖 <span class="num">${i.prime} g/L</span> で約 <span class="num">${(i.prime*0.0646).toFixed(2)}%</span></div><div class="calc-res">→ 最終の度数 <b class="num">${i.abv.toFixed(1)}%</b></div></div>`;
  }
  if(i.kind==='dissolve'){
    if(!i.kg)return `<p class="hint">エキスの量を入れると、溶解後の比重を計算します。</p>`;
    if(!i.water)return `<p class="hint">この工程より前の「水質調整」か「湯沸かし」に水量を入れると、比重を計算します。</p>`;
    return `<div class="calc"><div>エキス <span class="num">${i.kg.toFixed(2)} kg</span> × 収率 = <b class="num">${i.E.toFixed(2)} kg</b>、水 <span class="num">${fv(i.water)} L</span></div><div class="calc-res">→ <b class="num">${fv(i.vol)} L</b> / <b class="num">SG ${fsg(i.sg)}</b> <span class="num muted">${plato(i.sg).toFixed(1)}°P</span></div></div>`;
  }
  if(!i.kg)return `<p class="hint">この工程より前の「モルト投入」にモルトの量を入れると、麦汁の比重を計算します。</p>`;
  if(!i.V)return `<p class="hint">「得る麦汁量」を入れると、その量の麦汁の比重を計算します。</p>`;
  let h=`<div class="calc"><div>モルト <span class="num">${i.kg.toFixed(2)} kg</span> × 収率 → エキス最大 <span class="num">${i.pot.toFixed(2)} kg</span><br>× 糖化効率 <span class="num">${i.eff0}%</span>${i.fac<1?` × pH補正 <span class="num">${i.fac.toFixed(2)}</span>`:''} = <b class="num">${i.E.toFixed(2)} kg</b> を <span class="num">${fv(i.V)} L</span> の麦汁に</div><div class="calc-res">→ <b class="num">SG ${fsg(i.sg)}</b> <span class="num muted">${plato(i.sg).toFixed(1)}°P</span></div><div class="muted">推定マッシュpH <span class="num">${i.mp.toFixed(2)}</span>（水のpH ${i.wp.toFixed(2)}${i.noWater?'、水質調整の工程がないため7とみなす':''}）。${i.fac<1?`最適範囲 5.2〜5.5 から外れるため、効率を ${Math.round((1-i.fac)*100)}% 下げています。`:'最適範囲 5.2〜5.5 なので補正なし。'}</div>`;
  if(i.actEff!=null)h+=`<div class="act">実測（<span class="num">${fv(i.actVol)} L / ${fsg(i.actSg)}</span>${i.volGuessed?'、液量は予定値':''}）から求めた糖化効率 <b class="num">${i.actEff.toFixed(1)}%</b></div>`;
  return h+`</div>`;
}
function diluteHelp(s,t){
  const tg=n(s.p.target),b=t.dbase||t.before,isTrub=s.type==='trub';
  if(tg==null)return `<p class="hint">目標比重を入れると、必要な加水量を計算します。</p>`;
  if(b.vol==null||b.sg==null)return `<p class="hint">${isTrub?'澱引き後':'この前の工程で'}の液量と比重がわかると、必要な加水量を計算できます。</p>`;
  if(tg>=b.sg)return `<p class="hint">加水前の比重 ${fsg(b.sg)} がすでに目標以下です。加水は不要です。</p>`;
  const need=b.vol*((b.sg-1)/(tg-1)-1);
  return `<div class="helper"><span>${isTrub?'澱引き後':'加水前'} <span class="num">${fv(b.vol)} L / ${fsg(b.sg)}</span> → 目標 <span class="num">${fsg(tg)}</span> には <b class="num">${need.toFixed(2)} L</b></span><button data-act="applyDil" data-id="${s.id}" data-v="${need.toFixed(2)}">加水量に入れる</button></div>`;
}
const numIn=(base,k,v,ph,lab)=>`<input type="number" inputmode="decimal" step="any" id="${base.replace(/\|/g,'-')}-${k}" aria-label="${lab||k}" data-f="${base}|${k}" value="${esc(v)}" placeholder="${ph??''}">`;
function catSelect(kind,base,cur){

}
function itemRow(s,grp,j,it,kind){
  const base=`${s.id}|${grp}|${j}`,custom=it.cat==='custom';
  let nums;
  if(kind==='add')nums=`<div class="irow-nums two"><div class="inp">${numIn(base,'amt',it.amt,'','量')}</div><div class="inp"><select id="${base.replace(/\|/g,'-')}-unit" aria-label="単位" data-f="${base}|unit">${['g','ml','mg/L'].map(u=>`<option ${it.unit===u?'selected':''}>${u}</option>`).join('')}</select></div></div>`;
  else if(kind==='hop')nums=`<div class="irow-nums ${s.type==='boil'?'':'two'}"><div class="inp">${numIn(base,'alpha',it.alpha,'','α酸')}<u>% α</u></div><div class="inp">${numIn(base,'g',it.g,'','量')}<u>g</u></div>${s.type==='boil'?`<div class="inp">${numIn(base,'t',it.t,'','煮沸時間')}<u>分</u></div>`:''}</div>`;
  else nums=`<div class="irow-nums two"><div class="inp">${numIn(base,'amt',it.amt,'','量')}<u>kg</u></div><div class="inp">${numIn(base,'yld',it.yld,DEF.yld,'収率')}<u>% 収率</u></div></div>`;
  return `<div class="irow"><div class="irow-top"><div class="inp sel">${catSelect(kind,base,it.cat)}</div><button class="icon" data-act="delItem" data-g="${grp}" data-id="${s.id}" data-j="${j}" aria-label="行を削除">✕</button></div>
    ${custom?`<div class="inp"><input type="text" id="${base.replace(/\|/g,'-')}-name" aria-label="名前" data-f="${base}|name" value="${esc(it.name)}" placeholder="名前を入力"></div>`:''}${nums}</div>`;
}
function listHTML(s,L){

    ${hint?`<p class="hint">${hint}</p>`:''}<button class="addrow" data-act="addItem" data-g="list" data-id="${s.id}">＋ 行を追加</button></div>`;

function hopsHTML(s){

function yeastBody(s){

    ${custom?`<div class="inp"><input type="text" id="${s.id}-yname" aria-label="酵母の名前" data-f="${s.id}|p|name" value="${esc(s.p.name)}" placeholder="酵母の名前"></div>`:''}

function sheetHTML(){
  const r=cur(),st=STYLES[r.style],g=sheet;
  const main=st.picks.filter(k=>GTYPE[k]===g);
  const rest=Object.keys(GTYPE).filter(k=>GTYPE[k]===g&&!main.includes(k));
  const other=['custom',...(isBrew()&&g!=='mash'?['measure']:[])];
  const grid=ks=>`<div class="picks">${ks.map(k=>`<button class="pick" data-act="add" data-type="${k}" data-g="${g}"><b>${TYPES[k].n}</b><span>${TYPES[k].sub}</span></button>`).join('')}</div>`;
  return `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="工程を追加">
    <div class="sheet-head"><h2>${gName(g,r.style)}の工程を追加</h2><button class="ghost" data-act="close">閉じる</button></div>
    ${grid(main)}${rest.length?`<div class="label">その他の方式の工程</div>${grid(rest)}`:''}
    <div class="label">${isBrew()?'記録・その他':'その他'}</div>${grid(other)}</div></div>`;
}

function refreshComputed(){
  const r=cur();if(!r)return;const brew=isBrew(),tr=track(r.steps,brew),pt=brew?planRows(r):null,pm=brew?track(r.plan||[],false).meta:null;
  document.getElementById('summary').innerHTML=summaryInner(r,tr,pt,pm);
  GROUPS.forEach(g=>{const e=document.getElementById('gsum-'+g);if(e)e.textContent=groupSummary(g,r,tr)});
  r.steps.forEach((s,i)=>{const a=document.getElementById('after-'+s.id);if(a)a.innerHTML=s.type==='water'?phHTML(s,brew):afterHTML(tr[i],pt&&pt[s.id],brew);
    if(s.type==='water'&&document.getElementById('wadd-'+s.id))waterRefresh(s);
    const h=document.getElementById('help-'+s.id);if(h)h.innerHTML=diluteHelp(s,tr[i]);
    const c=document.getElementById('info-'+s.id);if(c)c.innerHTML=calcInfo(tr[i])});
}
function touch(){const r=cur();if(r)r.updated=Date.now();save()}

function onInput(e){
  const el=e.target.closest('[data-f]');if(!el)return;
  const parts=el.dataset.f.split('|'),r=cur();if(!r)return;
  if(parts[0]==='doc'){r[parts[1]]=el.value;if(parts[1]==='doneDate')r.doneAuto=!el.value;if(parts[1]==='date'||parts[1]==='doneDate'){syncDone(r);const dd=document.getElementById('bdone');if(dd&&parts[1]==='date')dd.value=r.doneDate||'';const h=document.getElementById('done-hint');if(h)h.textContent=doneHint(r)}touch();return}
  const s=r.steps.find(x=>x.id===parts[0]);if(!s)return;
  if(parts[1]==='p')s.p[parts[2]]=el.value;
  else if(parts[1]==='meas')s.meas[parts[2]]=el.value;
  else if((parts[1]==='list'||parts[1]==='hops')&&parts[3]==='cat'){
    const it=(parts[1]==='hops'?s.hops:s.list)[+parts[2]],c=CATIDX[el.value];it.cat=el.value;
    if(c){it.name=c.name;if(c.kind==='hop')it.alpha=String(c.v);else if(c.kind==='add')it.unit=c.v;else{it.yld=String(c.v);if(c.can&&!it.amt)it.amt='1.7'}}
    else if(el.value==='custom')it.name=it.name||'';
    touch();render();return}
  else if(parts[1]==='ycat'){const c=CATIDX[el.value];s.p.cat=el.value;if(c){s.p.name=c.name;s.p.atten=String(c.v)}touch();render();return}
  else if(parts[1]==='list')s.list[+parts[2]][parts[3]]=el.value;
  else if(parts[1]==='hops')s.hops[+parts[2]][parts[3]]=el.value;
  else if(parts[1]==='rest')s.rests[+parts[2]][parts[3]]=el.value;
  else if(parts[1]==='dec')s.decs[+parts[2]][parts[3]]=el.value;
  else if(parts[1]==='decN'){const k=+el.value;while(s.decs.length<k)s.decs.push({...DEC_DEF[s.decs.length]});s.decs.length=k;s.p.decN=String(k);touch();render();return}
  else if(parts[1]==='memo')s.memo=el.value;
  else if(parts[1]==='title')s.title=el.value;
  if(isBrew()&&parts[2]==='days'){syncDone(r);const dd=document.getElementById('bdone');if(dd)dd.value=r.doneDate||'';const h=document.getElementById('done-hint');if(h)h.textContent=doneHint(r)}
  touch();refreshComputed();
  if(s.type==='mash'){const d=document.getElementById('deco-'+s.id);if(d){const i=r.steps.indexOf(s);d.innerHTML=decoHTML(s,kgBefore(r.steps,i))}}
}
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.classList.contains('scrim')&&e.target!==b)return;
  const a=b.dataset.act,id=b.dataset.id,r=isList()?null:cur();
  const prevArmed=armed;armed=null;
  const idx=r?r.steps.findIndex(s=>s.id===id):-1;
  switch(a){
    case 'back':if(sheet||stack.length)history.back();return;
    case 'goList':go({screen:b.dataset.v,id:null});break;
    case 'pickRecipe':sheet='pick';history.pushState({app:1},'');break;
    case 'brewFrom':{const rr=db.recipes.find(x=>x.id===id);if(!rr)break;sheet=false;history.replaceState({app:1},'');const nb=startBrew(rr);db.brews.push(nb);stack.push(view);view={screen:'brew',id:nb.id};window.scrollTo(0,0);save();break}
    case 'wskip':r.steps[idx].p.skip=!r.steps[idx].p.skip;touch();break;
    case 'gravToggle':r.showGrav=!r.showGrav;save();break;
    case 'gtoggle':{const g=b.dataset.g;r.collapsed=r.collapsed||{};r.collapsed[g]=!r.collapsed[g];save();break}
    case 'exitNo':closeExit(true);return;
    case 'exitYes':doExit();return;
    case 'new':{const st=b.dataset.style,nr={id:uid(),name:'',style:st,updated:Date.now(),steps:sortSteps(defaultSteps(st)),collapsed:ALLCLOSED()};db.recipes.push(nr);go({screen:'recipe',id:nr.id});save();break}
    case 'open':{const d=(b.dataset.kind==='b'?db.brews:db.recipes).find(x=>x.id===id);if(d)d.collapsed=ALLCLOSED();go({screen:b.dataset.kind==='b'?'brew':'recipe',id});break}
    case 'del':{const k=b.dataset.kind;if(prevArmed===k+id){if(k==='r')db.recipes=db.recipes.filter(x=>x.id!==id);else db.brews=db.brews.filter(x=>x.id!==id);save()}else armed=k+id;break}
    case 'startBrew':{const nb=startBrew(r);db.brews.push(nb);go({screen:'brew',id:nb.id});save();break}
    case 'tpl':{const have=new Set(r.steps.map(x=>x.type));STYLES[r.style].tpl.filter(k=>!have.has(k)).forEach(k=>{const s=mkStep(k,r.style);s.open=false;r.steps.push(s)});sortSteps(r.steps);r.collapsed={};touch();break}
    case 'sheet':sheet=b.dataset.g||'brew';history.pushState({app:1},'');break;
    case 'close':if(sheet)history.back();return;
    case 'add':{const s=mkStep(b.dataset.type,r.style);if(!GTYPE[s.type])s.grp=b.dataset.g;r.steps.push(s);sortSteps(r.steps);r.collapsed=r.collapsed||{};r.collapsed[gOf(s)]=false;touch();if(sheet)history.back();else render();
      requestAnimationFrame(()=>document.getElementById('st-'+s.id)?.scrollIntoView({behavior:'smooth',block:'center'}));return}
    case 'toggle':r.steps[idx].open=!r.steps[idx].open;save();break;
    case 'done':r.steps[idx].done=!r.steps[idx].done;if(r.steps[idx].done)r.steps[idx].open=false;touch();break;
    case 'up':if(idx>0&&gOf(r.steps[idx-1])===gOf(r.steps[idx])){[r.steps[idx-1],r.steps[idx]]=[r.steps[idx],r.steps[idx-1]];touch()}break;
    case 'down':if(idx<r.steps.length-1&&gOf(r.steps[idx+1])===gOf(r.steps[idx])){[r.steps[idx+1],r.steps[idx]]=[r.steps[idx],r.steps[idx+1]];touch()}break;
    case 'dels':if(prevArmed===id){r.steps.splice(idx,1);touch()}else armed=id;break;
    case 'addItem':{const s=r.steps[idx];if(b.dataset.g==='hops')s.hops.push({cat:'',name:'',alpha:'',g:'',t:s.type==='boil'?'0':''});else s.list.push(CATKIND[s.type]==='add'?{cat:'',name:'',amt:'',unit:'g'}:{cat:'',name:'',amt:'',yld:''});touch();break}
    case 'delItem':(b.dataset.g==='hops'?r.steps[idx].hops:r.steps[idx].list).splice(+b.dataset.j,1);touch();break;
    case 'seg':r.steps[idx].p[b.dataset.k]=b.dataset.v;touch();break;
    case 'addRest':{const rs=r.steps[idx].rests,l=rs[rs.length-1];rs.push({temp:l?String((n(l.temp)||60)+6):'66',time:'20'});touch();break}
    case 'delRest':r.steps[idx].rests.splice(+b.dataset.j,1);touch();break;
    case 'applyDil':r.steps[idx].p.add=b.dataset.v;touch();break;
  }
  render();
});
/* 戻る操作：画面を進めるたびに履歴を1つ積み、端末の戻るボタン（popstate）で1つ戻す。
   ホームでさらに戻ると、終了の確認を出す */
let stack=[],exitOpen=false;
function go(v){stack.push(view);view=v;sheet=false;history.pushState({app:1},'');window.scrollTo(0,0)}
addEventListener('popstate',()=>{
  if(exitOpen){closeExit(true);return}
  if(sheet){sheet=false;render();return}
  if(stack.length){view=stack.pop();armed=null;render();window.scrollTo(0,0);return}
  openExit();
});
function openExit(){
  exitOpen=true;let d=document.getElementById('exitdlg');
  if(!d){d=document.createElement('div');d.id='exitdlg';document.body.appendChild(d)}
  d.innerHTML=`<div class="scrim center"><div class="dialog" role="alertdialog" aria-labelledby="exit-t"><h2 id="exit-t">アプリを終了しますか？</h2><p id="exit-msg" class="hint">入力した内容は保存されています。</p><div class="dlg-btns"><button class="ghost big" data-act="exitNo">いいえ</button><button class="primary small" data-act="exitYes">はい</button></div></div></div>`;
}
function closeExit(repush){exitOpen=false;const d=document.getElementById('exitdlg');if(d)d.remove();if(repush)history.pushState({app:1},'')}
function doExit(){
  exitOpen=false;
  try{window.close()}catch(e){}
  setTimeout(()=>{const m=document.getElementById('exit-msg');if(m){m.textContent='この端末ではアプリから閉じられませんでした。もう一度「戻る」を押すと終了します。';const b=document.querySelector('#exitdlg .dlg-btns');if(b)b.innerHTML='<button class="ghost big" data-act="exitNo">終了しない</button>'}},300);
}
db=load();
history.replaceState({base:1},'');history.pushState({app:1},'');
render();
</script>
